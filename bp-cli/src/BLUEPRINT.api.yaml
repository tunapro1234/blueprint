# =============================================================================
# API
# =============================================================================

api:
  cli:
    name: bp
    usage: bp <command> [path] [flags]

    root_resolution: |
      Root blueprint kavramı:
      - _meta.root: true olan blueprint proje root'udur
      - Alt paketlerde argümansız komut çalıştırıldığında:
        1. Yukarı doğru parent klasörlerde blueprint aranır
        2. _meta.root: true olan ilk blueprint root olarak belirlenir
        3. Root bulunamazsa en üstteki blueprint root sayılır
        4. Komut root'tan recursive çalıştırılır
      - Explicit path verilirse (örn: "bp validate .") sadece o path için çalışır

      Örnekler:
        bp validate        → root bul, root'tan recursive validate
        bp validate .      → sadece bulunulan paket (recursive)
        bp validate . --no-recursive  → sadece bulunulan paket (non-recursive)
        bp validate ./src  → sadece ./src paketi (recursive)
        bp status          → root bul, root'tan recursive status
        bp status .        → sadece bulunulan paket (recursive)
        bp status . --no-recursive → sadece bulunulan paket (non-recursive)

    commands:
      - name: validate
        desc: YAML syntax ve schema kontrolü
        usage: bp validate [path] [--no-recursive]
        args:
          - name: path
            default: "."
            desc: Blueprint dosyası veya klasör
        flags:
          - name: -nr, --no-recursive
            desc: Sadece verilen paketi kontrol et
        line_limits:
          api: 300              # Soft limit - aşılırsa warning
          implementation: 900   # Soft limit - aşılırsa warning
        output:
          success: "✓ {path}"
          warning: "⚠ {path}: {message}"
          error: "✗ {path}: {message}"
          line_warning: "⚠ {path}: {section} exceeds {limit} lines ({actual} lines)"
        exit_codes:
          0: Valid
          1: Error var
          2: Sadece warning (intent eksik, satır limiti aşımı)

      - name: status
        desc: Kod, dependency ve dependent değişiklik kontrolü
        usage: bp status [path] [--no-recursive]
        flags:
          - name: -nr, --no-recursive
            desc: Sadece verilen paketi kontrol et
        output:
          fresh: "✓ {path} (fresh)"
          stale: "⚠ {path} (stale, {n} files changed)"
          deps_stale: "⚠ {path} (deps changed: {dep_names})"
          deps_upgrade: "⚠ {dep}: {pinned} → {latest}"
          deps_upgrade_api: "⚠ {dep}: {pinned} → {latest} (API CHANGED!)"
          no_state: "○ {path} (no snapshot)"
          implementing: "⧗ {path} (implementing)"
          dependents: |
            Dependents:
              ../consumer using 20260115-xxxx (OUTDATED - 2 behind)
              ../other using 20260116-yyyy (current)
        exit_codes:
          0: Fresh (değişiklik yok)
          1: Stale (kod veya dependency değişmiş)
          2: No snapshot (henüz snapshot alınmamış)
        staleness_sources: |
          Stale durumu şu kaynaklardan gelebilir:
          1. Kendi dosyaları değişmiş (files_changed)
          2. BLUEPRINT.yaml değişmiş (blueprint_changed)
          3. Dependency'nin snapshot'ı değişmiş - pinned != latest (deps_changed)
          4. Dependency'nin api_hash'i değişmiş (deps_api_changed, daha kritik)
        status_flags: |
          Ayrı flag'ler (staleness reason'a eklenmez):
          - implementing: impl.lock var mı?
          - impl_hidden: impl.hidden var mı?
          - working_clean: tracked dosyalarda değişiklik yok mu?
          - blueprint_changed: BLUEPRINT.yaml hash değişmiş mi?
          - api_changed: API section hash değişmiş mi?
          - spec_changed: Implementation section hash değişmiş mi?

      - name: plan
        desc: Değişen paketleri dependency sırasına göre listeler (leaf-first)
        usage: bp plan [path] [--no-recursive]
        flags:
          - name: -nr, --no-recursive
            desc: Sadece verilen paketi planla
        behavior: |
          - Default recursive; --no-recursive sadece verilen path'i tarar
          - Dependency graph'e göre leaf-first sıralar
          - Sadece stale veya no_snapshot paketleri listeler
          - deps_changed/deps_api_changed görülen paketlerde import yolları güncellenmelidir
          - Sadece import güncellemesi yapıldıysa yeni snapshot almak gerekmez
        output: |
          1. ./yamlparser (no snapshot)
          2. ./commands (stale, blueprint_changed)
          3. . (stale, deps_changed)
        exit_codes:
          0: Başarılı (liste boş olabilir)
          1: Hata (circular dependency veya okuma hatası)

      - name: cancel
        desc: Aktif implementation oturumunu iptal eder
        usage: bp cancel [path]
        behavior: |
          - impl.lock yoksa hata verir
          - impl.lock varsa silinir
          - Working tree dosyaları değiştirilmez
        output:
          success: "Implementation cancelled."
          no_active: "No active implementation."
        exit_codes:
          0: Başarılı
          1: Aktif implementasyon yok veya hata

      - name: apply
        desc: Snapshot al, deps/ symlink oluştur, working tree temizle
        usage: bp apply [path] [-m "message"] [--skip-tests]
        behavior: |
          - impl.lock yoksa hata verir
          - Blueprint validate edilir (error varsa exit 2)
          - tests.verification komutları çalıştırılır (--skip-tests ile atlanır)
          - Snapshot oluşturulur (history/{id}/)
          - impl/ klasörüne kod kopyalanır
          - deps/ klasörü oluşturulur, her dependency için symlink:
            deps/{dep_name}/ → {dep_path}/{state_dir}/history/{pinned_id}/impl/
          - Working tree temizlenir
          - impl.hidden yazılır, impl.lock silinir
        output:
          success: "Snapshot created: {id}"
        exit_codes:
          0: Başarılı
          1: Testler başarısız veya hata
          2: Validation hatası

      - name: deps
        desc: Dependency graph göster
        usage: bp deps [path] [--upgrades]
        flags:
          - name: --upgrades
            desc: Upgrade mevcut dependency'leri göster
        output:
          graph: |
            Topological sırada dependency listesi:
            1. leaf/package
            2. mid/package
            3. root/package (current)
          upgrades: |
            ./yamlparser: 20260115-xxxx → 20260116-yyyy (API CHANGED!)
            ./commands: (up to date)
        exit_codes:
          0: Başarılı
          1: Circular dependency veya hata

      - name: map
        desc: Project map - tüm paketlerin snapshot ve dependency durumu
        usage: bp map [path] [--no-recursive]
        flags:
          - name: -nr, --no-recursive
            desc: Sadece verilen paketi göster
        behavior: |
          Default recursive olarak tüm paketleri tarar ve her biri için gösterir:
          - Paket adı ve path
          - Current snapshot ID
          - API hash (kısa)
          - Dependency listesi ve pinned snapshot'ları
          - Rotten flag varsa işaretle
        output:
          format: |
            ./
              snapshot: 20260116-1430-a1b2-feature
              api: sha256:abc123...
              deps:
                ./yamlparser @ 20260115-1000-x1y2 (api: def456)
                ./commands @ 20260116-0900-y3z4 (api: ghi789) [ROTTEN]

            ./yamlparser/
              snapshot: 20260115-1000-x1y2-stable
              api: sha256:def456...
              deps: (none)

            ./commands/
              snapshot: 20260116-0900-y3z4-init [ROTTEN]
              api: sha256:ghi789...
              deps:
                ./yamlparser @ 20260115-1000-x1y2 (api: def456)
        exit_codes:
          0: Başarılı
          1: Hata

      - name: init
        desc: Yeni BLUEPRINT.yaml oluştur
        usage: bp init [path]
        behavior:
          - Zaten varsa hata ver, üzerine yazma
          - Template BLUEPRINT.yaml oluştur
        exit_codes:
          0: Oluşturuldu
          1: Zaten var veya hata

      - name: log
        desc: Snapshot geçmişi
        usage: bp log [path] [-n count]
        flags:
          - name: -n, --count
            default: 10
            desc: Gösterilecek snapshot sayısı
        output: |
          20260116-1430-a1b2-add-validation   "Add validation logic"
          20260115-1500-c3d4-fix-edge-cases   "Fix edge cases"
          20260114-0900-e5f6-initial          "Initial snapshot"
        exit_codes:
          0: Başarılı (boş geçmiş dahil)
          1: Hata

      - name: diff
        desc: İki snapshot arasındaki blueprint farkı
        usage: bp diff [path] [id1] [id2]
        behavior:
          - Argüman yok: current blueprint vs son snapshot
          - Tek ID: o snapshot vs current blueprint
          - İki ID: iki snapshot'ın blueprint'leri karşılaştırılır
        output: |
          Unified diff formatı (--- / +++ / @@ ile)
          Fark yoksa boş çıktı (stdout'a hiçbir şey yazılmaz)
        exit_codes:
          0: Başarılı (fark var veya yok)
          1: ID bulunamadı veya hata

      - name: show
        desc: Belirli snapshot'ın blueprint'ini göster
        usage: bp show [path] [id]
        behavior:
          - ID verilmezse son snapshot
          - blueprint/history/XXXX/BLUEPRINT.yaml içeriğini stdout'a yazar
        exit_codes:
          0: Başarılı
          1: ID bulunamadı veya hata

      - name: implement
        desc: Implementation başlat - dependency kontrol + reverse tracking + symlink restore
        usage: bp implement [path] [snapshot_id] [--clean]
        note: "Alias: bp impl"
        behavior: |
          0. Blueprint'i validate et (error varsa exit 2)
          1. Eğer impl.lock varsa hata ver (aktif implementasyon var)
          2. Blueprint'i oku, dependencies bölümünü kontrol et
          3. Her dependency için:
             - Pin'lenmiş snapshot mevcut mu kontrol et
             - Snapshot yoksa hata: "Dependency {dep} has no snapshot"
             - Dependency'nin state.yaml'ına kendini kaydet (reverse tracking)
          4. --clean yoksa kendi snapshot'ından impl/ restore et
             - snapshot_id verilirse o ID restore edilir
             - verilmezse current snapshot restore edilir
          5. deps/ klasörü oluştur, her dependency için symlink:
             deps/{dep_name}/ → {dep_path}/{state_dir}/history/{pinned_id}/impl/
          6. impl.lock oluştur (aktif implementasyon)
          7. "Ready to implement" mesajı ver

          Implementation bitince: bp apply -m "message"
        output:
          success: |
            Dependencies:
              ./yamlparser @ 20260115-1000-a1b2-stable ✓
              ./commands   @ 20260116-0900-c3d4-init   ✓
            Ready to implement.
          missing_dep: "✗ Dependency {dep} has no snapshot. Run 'bp apply' in {dep} first."
        exit_codes:
          0: Ready to implement
          1: Dependency snapshot eksik
          2: Validation hatası veya blueprint bulunamadı

      - name: upgrade
        desc: Dependency'leri güncelle (symlink günceller, test çalıştırır)
        usage: bp upgrade [dep-path] [--safe] [--all] [--force]
        flags:
          - name: --safe
            desc: Sadece API değişmeyenleri upgrade et
          - name: --all
            desc: Tüm dependency'leri upgrade et
          - name: --force
            desc: Rotten snapshot'ları da upgrade et
        behavior: |
          1. dep-path verilmişse sadece o dependency'yi upgrade et
          2. --all verilmişse tüm dependency'leri upgrade et
          3. --safe verilmişse sadece api_changed=false olanları upgrade et
          4. Rotten snapshot'ları atla (--force ile zorla)
          5. Her upgrade için:
             - deps/ symlink'ini güncelle
             - tests.verification çalıştır
             - Test fail → rollback + rotten flag
             - Test pass → state.yaml güncelle
          6. API değişikliği varsa uyarı göster
        output:
          success: "Upgraded {dep}: {pinned} → {latest}"
          failed: "Failed {dep}: tests failed, rolled back, marked rotten"
          skipped_rotten: "Skipped {dep}: rotten (use --force)"
          skipped_api: "Skipped {dep}: API changed (use --safe=false)"
        exit_codes:
          0: En az bir upgrade başarılı
          1: Tüm upgrade'ler başarısız veya hata

  library:
    note: |
      Aşağıdaki tipler language-agnostic tanımlanmıştır.
      Implementasyon diline göre class, struct, record, interface vb. kullanılabilir.

    types:
      - name: Blueprint
        desc: Tek BLUEPRINT.yaml dosyasını temsil eder
        fields:
          - name: path
            type: string
            desc: BLUEPRINT.yaml dosyasının tam yolu
          - name: data
            type: map<string, any>
            desc: Parse edilmiş YAML içeriği
          - name: state_dir
            type: string
            desc: blueprint/ klasörünün yolu (_meta.state_dir, default .blueprint)
        methods:
          - name: validate
            returns: ValidationResult
            desc: YAML syntax + schema check
          - name: is_stale
            returns: bool?
            desc: Kod değişmiş mi? (null = snapshot yok)
          - name: api_hash
            returns: string
            desc: API section hash
          - name: spec_hash
            returns: string
            desc: Implementation section hash
          - name: get_changed_files
            returns: string[]
            desc: Değişen dosyaların listesi
          - name: get_section
            args: [section: string]
            returns: map<string, any>?
            desc: api, implementation, tests bölümünü al
          - name: get_history
            returns: HistoryEntry[]
            desc: Snapshot geçmişi
          - name: save_state
            returns: void
            desc: blueprint/state.yaml güncelle

      - name: HistoryEntry
        desc: Tek bir snapshot kaydı
        fields:
          - name: id
            type: string
            desc: "Snapshot ID: YYYYMMDD-HHMM-{4-char-hash}-{slug}, örn '20260116-1430-a1b2-add-validate'"
          - name: timestamp
            type: string
            desc: ISO 8601 format
          - name: message
            type: string
            desc: Snapshot mesajı
          - name: content_hash
            type: string
            desc: Tam content hash (referans için)
          - name: api_hash
            type: string
            desc: API section'ın hash'i
          - name: spec_hash
            type: string
            desc: Implementation section'ın hash'i
          - name: impl_hash
            type: string
            desc: Implementation dosyalarının birleşik hash'i
          - name: rotten
            type: bool
            desc: Snapshot rotten mı? (upgrade testleri fail ettiyse true)

      - name: PlanStep
        desc: Plan sırasındaki tek adım
        fields:
          - name: path
            type: string
            desc: Blueprint path (relative)
          - name: state
            type: string
            desc: "stale | no_snapshot"
          - name: reason
            type: string
            desc: "files_changed | blueprint_changed | deps_changed | deps_api_changed"

      - name: PlanResult
        desc: Plan komutu sonucu
        fields:
          - name: steps
            type: PlanStep[]
            desc: Leaf-first sıralı adımlar

      - name: DepState
        desc: Bir dependency'nin pin durumu (state.yaml deps içinde)
        fields:
          - name: pinned
            type: string
            desc: Pin'lenmiş snapshot ID
          - name: latest
            type: string
            desc: Dependency'nin en son snapshot ID'si
          - name: api_hash
            type: string
            desc: Pin'lenmiş versiyonun API hash'i
          - name: latest_api_hash
            type: string
            desc: En son versiyonun API hash'i
          - name: api_changed
            type: bool
            desc: API değişmiş mi? (convenience flag)
          - name: rotten
            type: bool
            desc: Latest snapshot rotten mı?

      - name: DepRef
        desc: Reverse dependency bilgisi (state.yaml dependents içinde)
        fields:
          - name: using
            type: string
            desc: Hangi snapshot'ımı kullanıyor

      - name: BlueprintTree
        desc: Klasör hiyerarşisindeki tüm blueprint'ler
        fields:
          - name: root
            type: string
            desc: Root klasör yolu
        methods:
          - name: walk
            returns: Blueprint[]
            desc: Tüm blueprint'leri listele (iterable)
          - name: resolve_deps
            args: [bp: Blueprint]
            returns: Blueprint[]
            desc: Bir blueprint'in dependency'lerini bul
          - name: topological_sort
            returns: Blueprint[]
            desc: Dependency sırasına göre sırala

      - name: ValidationResult
        desc: Validation sonucu
        fields:
          - name: valid
            type: bool
            desc: Geçerli mi?
          - name: errors
            type: string[]
            desc: Hata mesajları
          - name: warnings
            type: string[]
            desc: Uyarı mesajları
