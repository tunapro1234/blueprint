[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "bp-tunnel"
version = "0.3.1"
description = "Inter-agent messaging for Blueprint ecosystem"
readme = "README.md"
license = "GPL-3.0-or-later"
requires-python = ">=3.10"
authors = [
    { name = "Tuna Gul", email = "tunapro1234@gmail.com" },
]
keywords = ["agent", "messaging", "tunnel", "ipc", "blueprint"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries",
    "Topic :: System :: Networking",
    "Typing :: Typed",
]
dependencies = [
    "pyyaml>=6.0",
]

[project.urls]
Homepage = "https://github.com/tunapro1234/blueprint"
Repository = "https://github.com/tunapro1234/blueprint"
Issues = "https://github.com/tunapro1234/blueprint/issues"

[project.scripts]
bp-tunnel = "bp_tunnel.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/bp_tunnel"]

[tool.hatch.build.targets.sdist]
include = [
    "src/bp_tunnel/",
    "README.md",
    "LICENSE",
    "pyproject.toml",
]
