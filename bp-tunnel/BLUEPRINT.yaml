_meta:
  version: "0.2.0"
  updated: 2026-02-13
  status: mvp
  root: true

project:
  name: bp-tunnel
  tagline: Inter-agent messaging for Blueprint ecosystem

author:
  name: Tuna Gul
  github: tunapro1234

intent: |
  Ajanlar arasi mesajlasma sistemi. Standart mesaj formati tanimi +
  pluggable transport katmani ile farkli iletim yontemlerini destekler.
  Ilk transport: file-based (mailbox dizinleri).

overview: |
  bp-tunnel, Blueprint ekosistemindeki ajanlarin birbirleriyle
  haberlesebilmesini saglar.

  Temel kavramlar:
  - Message: Standart mesaj formati (YAML) - from, payload, opsiyonel to
  - Transport: Mesajlarin nasil iletildigini belirleyen katman (ABC)
  - Tunnel: Named channel - birden fazla agent katilabilir, admin sistemi
  - Mailbox: Her agent'in tunnel icindeki mesaj kutusu

  Ozellikler:
  - Broadcast (to=None) ve direct mesaj (to="agent")
  - wait_for(from_=) ile blocking bekle, send_wait() ile gonder+bekle
  - Admin sistemi: creator admin, promote/demote/leave
  - Path traversal koruması, atomik dosya yazimi, file locking
  - Bozuk YAML ve race condition dayanikliligi

  Ilk transport file-based: /tmp/bp-tunnel/ altinda her tunnel bir dizin,
  her agent'in mailbox'i bir alt dizin, her mesaj bir YAML dosyasi.

plan:
  - id: message_format
    status: done
    desc: Message dataclass + YAML serialization
  - id: transport_abc
    status: done
    desc: Transport abstract base class
  - id: file_transport
    status: done
    desc: File-based transport implementasyonu
  - id: tunnel_wrapper
    status: done
    desc: Tunnel class (agent identity + transport + admin)
  - id: cli
    status: done
    desc: CLI (create, join, send, recv, listen, promote, demote, leave, info, ls)
  - id: security_fixes
    status: done
    desc: Path traversal, race condition, auth, corrupt YAML, idempotency fixleri

