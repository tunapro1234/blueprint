# bp - Blueprint Management Tool

_meta:
  version: "0.1.0"
  updated: 2025-01-15
  status: draft

intent: Blueprint dosyalarını yöneten, versiyonlayan ve implement eden CLI tool

overview: |
  bp tool, YAML formatındaki blueprint dosyalarını yönetir.

  Temel konseptler:
  - Her klasör bir paket
  - Alt klasörler implicit dependency
  - blueprint.yaml kullanıcı düzenler
  - .blueprint/ tool yönetir (state, lock, history)

  Komutlar:
  - bp validate: YAML syntax + schema check
  - bp status: Blueprint değişmiş mi? (son implement'e göre)
  - bp deps: Dependency graph
  - bp init: Yeni blueprint oluştur
  - bp log: Implementation geçmişi
  - bp diff: İki implementation'ın blueprint farkı
  - bp show: Eski implementation'ın blueprint'ini göster
  - bp implement: Blueprint'i kaydet ve agent ile implement et

# =============================================================================
# API
# =============================================================================

api:
  cli:
    name: bp
    usage: bp <command> [path] [flags]

    commands:
      - name: validate
        desc: YAML syntax ve schema kontrolü
        usage: bp validate [path] [-r|--recursive]
        args:
          - name: path
            default: "."
            desc: Blueprint dosyası veya klasör
        flags:
          - name: -r, --recursive
            desc: Alt klasörleri de tara
        output:
          success: "✓ {path}"
          warning: "⚠ {path}: {message}"
          error: "✗ {path}: {message}"
        exit_codes:
          0: Valid
          1: Error var
          2: Sadece warning

      - name: status
        desc: Blueprint vs kod durumu (stale check)
        usage: bp status [path] [-r]
        output:
          fresh: "✓ {path} (fresh)"
          stale: "⚠ {path} (stale, {n} files changed)"
          no_state: "○ {path} (never implemented)"

      - name: deps
        desc: Dependency graph göster
        usage: bp deps [path]
        output: |
          Topological sırada dependency listesi:
          1. leaf/package
          2. mid/package
          3. root/package (current)

      - name: init
        desc: Yeni blueprint.yaml oluştur
        usage: bp init [path]
        behavior:
          - Zaten varsa hata ver, üzerine yazma
          - Template blueprint.yaml oluştur

      - name: log
        desc: Implementation geçmişi
        usage: bp log [path] [-n count]
        output: |
          #0003 2025-01-15 10:30 [success] "Add validation logic"
          #0002 2025-01-14 15:00 [success] "Fix edge cases"
          #0001 2025-01-13 09:00 [success] "Initial implementation"

      - name: diff
        desc: İki implementation arasındaki blueprint farkı
        usage: bp diff [path] [id1] [id2]
        behavior:
          - Default: current blueprint vs son implementation
          - İki ID verilirse: o iki implementation'ın blueprint'leri karşılaştırılır

      - name: show
        desc: Belirli bir implementation'ın blueprint'ini göster
        usage: bp show [path] [id]
        behavior:
          - ID verilmezse son implementation
          - .blueprint/history/XXXX/blueprint.yaml içeriğini gösterir

      - name: implement
        desc: Blueprint'i commit et ve agent ile implement et
        usage: bp implement [path] [-m "message"] [--dry-run]
        flags:
          - name: -m, --message
            desc: Commit mesajı (opsiyonel, yoksa agent üretir)
          - name: --dry-run
            desc: Plan göster, implement etme
        behavior:
          - Lock al (başkası implement edemez)
          - Blueprint snapshot'ını .blueprint/history'e kaydet
          - Mesaj yoksa agent özet üretir
          - Agent'ı çağır (agent/ alt paketi)
          - Başarılıysa state güncelle, lock bırak

  library:
    exports:
      - name: Blueprint
        type: class
        signature: Blueprint(path: Path)
        desc: Tek blueprint.yaml dosyasını temsil eder
        attributes:
          - path: Path
          - data: dict (parsed yaml)
          - state_dir: Path (.blueprint/)
        methods:
          - name: validate
            signature: "() -> ValidationResult"
            desc: YAML syntax + schema check
          - name: is_stale
            signature: "() -> bool"
            desc: Kod değişmiş mi?
          - name: get_section
            signature: "(section: str) -> dict"
            desc: api, implementation, tests bölümünü al
          - name: save_state
            signature: "() -> None"
            desc: .blueprint/state.yaml güncelle

      - name: BlueprintTree
        type: class
        signature: BlueprintTree(root: Path)
        desc: Klasör hiyerarşisindeki tüm blueprint'ler
        methods:
          - name: walk
            signature: "() -> Iterator[Blueprint]"
            desc: Tüm blueprint'leri iterate et
          - name: resolve_deps
            signature: "(bp: Blueprint) -> list[Blueprint]"
            desc: Bir blueprint'in dependency'lerini bul
          - name: topological_sort
            signature: "() -> list[Blueprint]"
            desc: Dependency sırasına göre sırala

      - name: ValidationResult
        type: dataclass
        fields:
          - valid: bool
          - errors: list[str]
          - warnings: list[str]

# =============================================================================
# IMPLEMENTATION
# =============================================================================

implementation:
  structure:
    - bp.py
    - core.py
    - state.py
    - yaml_parser.py
    - commands/
    - agent/

  data_structures:
    blueprint_dir: |
      .blueprint/
      ├── lock                    # Implement sırasında lock (PID + timestamp)
      ├── current                 # Son başarılı implementation ID
      └── history/
          ├── 0001/
          │   ├── blueprint.yaml  # O anki blueprint snapshot (tam kopya)
          │   ├── meta.yaml       # timestamp, message, agent, duration
          │   └── changes.yaml    # Oluşan/değişen dosyalar
          ├── 0002/
          │   └── ...
          └── ...

    lock_file: |
      # .blueprint/lock (implement sırasında)
      pid: 12345
      started: "2025-01-15T10:30:00"
      blueprint_hash: "sha256:abc123"

    meta_yaml: |
      # .blueprint/history/XXXX/meta.yaml
      id: "0001"
      timestamp: "2025-01-15T10:30:00"
      message: "Initial implementation"  # User veya agent tarafından
      duration_seconds: 45
      agent: "claude"  # Hangi agent implement etti
      status: success  # success | partial | failed

    changes_yaml: |
      # .blueprint/history/XXXX/changes.yaml
      created:
        - path: bp.py
          hash: "sha256:abc123"
        - path: core.py
          hash: "sha256:def456"
      modified: []
      deleted: []

    blueprint_template: |
      # {folder_name}

      _meta:
        version: "0.1.0"
        updated: {date}
        status: draft

      intent: TODO

      overview: |
        TODO

      api:
        exports: []

      implementation:
        structure: []

      tests:
        scenarios: []

  algorithms:
    staleness_check: |
      1. .blueprint/state.yaml oku
      2. Her tracked_file için:
         - Dosya hash'ini hesapla
         - State'teki hash ile karşılaştır
      3. Herhangi biri farklıysa → stale
      4. blueprint.yaml değiştiyse → stale

    dependency_resolution: |
      1. Alt dizinleri tara
      2. blueprint.yaml varsa → dependency
      3. Explicit dependencies: [...] varsa → ekle
      4. Recursive

    topological_sort: |
      1. Dependency graph oluştur
      2. Kahn's algorithm:
         - In-degree 0 olanları queue'ya ekle
         - Queue'dan al, result'a ekle
         - Komşuların in-degree'sini azalt
         - In-degree 0 olanları queue'ya ekle
      3. Cycle varsa hata

  decisions:
    - q: Neden tek blueprint.yaml?
      a: Basitlik. Agent tek dosya okur, bölümler içinde ayrılmış.

    - q: .blueprint/ ne işe yarar?
      a: Internal state. Son implement tarihi, file hash'leri. Kullanıcı dokunmaz.

    - q: Dependency nasıl belirlenir?
      a: |
        Alt klasörler implicit dependency:
        - Listelemeye gerek yok, otomatik taranır
        - blueprint.yaml varsa dependency olarak kabul edilir
        - has_blueprint: false ile istisna tanımlanır (örn: __pycache__)
        - Dış paketler: dependencies: [../other] ile explicit eklenir

    - q: Git gerekli mi?
      a: Hayır. Tamamen dosya sistemi bazlı. Hash'ler ile tracking.

    - q: External dependency var mı?
      a: |
        Hayır. Sadece Python stdlib.
        YAML parsing: PyYAML varsa kullan, yoksa basit regex-based parser.
        Fallback parser sadece bp'nin kullandığı subset'i destekler.

    - q: Hangi alanlar zorunlu?
      a: |
        Zorunlu: _meta.version, intent
        Opsiyonel: overview, api, implementation, tests
        Bilinmeyen alanlar ignore edilir (flexible schema)

    - q: Hangi dosyalar track edilir?
      a: |
        implementation.structure'da listelenen dosyalar.
        Alt klasörler (has_blueprint: true) hariç, onlar kendi state'lerini tutar.

    - q: Hash nasıl hesaplanır?
      a: |
        hashlib.sha256(file_content.encode('utf-8')).hexdigest()
        Sadece dosya içeriği, mtime değil.

    - q: Agent entegrasyonu var mı?
      a: |
        Hayır, MVP scope'unda değil.
        bp sadece blueprint yönetimi yapar.
        Agent entegrasyonu ayrı bir katman olarak eklenebilir.

  edge_cases:
    - case: YAML parse hatası
      handle: Satır numarası ile hata mesajı

    - case: Circular dependency
      handle: Topological sort'ta tespit, hata ver

    - case: .blueprint/ yok
      handle: İlk implement'te oluştur

    - case: blueprint.yaml yok
      handle: "not a blueprint package" olarak atla

# =============================================================================
# TESTS
# =============================================================================

tests:
  scenarios:
    # Validate
    - id: valid_blueprint
      given: Geçerli blueprint.yaml
      when: bp validate
      then: exit 0, "✓" gösterir

    - id: invalid_yaml_syntax
      given: Bozuk YAML (indent hatası)
      when: bp validate
      then: exit 1, satır numarası ile hata

    - id: missing_intent
      given: intent alanı yok
      when: bp validate
      then: exit 2, warning (error değil)

    - id: recursive_validate
      given: 3 alt klasör, 1'i invalid
      when: bp validate -r
      then: Hepsi listelenir, exit 1

    # Status
    - id: fresh_package
      given: Kod hiç değişmemiş
      when: bp status
      then: "fresh" gösterir

    - id: stale_package
      given: core.py değişmiş
      when: bp status
      then: "stale, 1 file changed"

    - id: never_implemented
      given: .blueprint/ yok
      when: bp status
      then: "never implemented"

    # Deps
    - id: no_deps
      given: Alt klasör yok
      when: bp deps
      then: Sadece kendisi listelenir

    - id: nested_deps
      given: a/ → b/ → c/ hiyerarşisi
      when: bp deps a/
      then: "c, b, a" sırasında

    - id: circular_deps
      given: a → b, b → a
      when: bp deps
      then: Hata mesajı

    # Init
    - id: init_empty_folder
      given: Boş klasör
      when: bp init
      then: blueprint.yaml oluşur

    - id: init_existing
      given: blueprint.yaml zaten var
      when: bp init
      then: Hata, üzerine yazmaz


  verification:
    - bp validate kendi üzerinde çalışır
    - bp status kendi üzerinde çalışır
    - Circular dependency tespit edilir
    - Sadece Python stdlib kullanılır
    - Python 3.10+ uyumlu
    - Windows/Linux/Mac path'leri çalışır
