name: Check
on:
  push:
    branches: [dev, dev-p2p]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      BP_NO_UPDATE_CHECK: '1'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
      - run: sudo apt-get update && sudo apt-get install -y tmux zsh
      - run: go test ./...
      - run: go vet ./...
      - run: python3 -m unittest scripts.test_local_cli scripts.test_publish_release scripts.test_runtime_usage scripts.test_migrate_codex_book
      - run: npm --prefix npm test
