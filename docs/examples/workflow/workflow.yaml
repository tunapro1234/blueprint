name: sample-scoring
version: 1
description: Score one fictional catalog record per prompt
units:
  file: records.json
  key: slug
prompt:
  template: prompts/score.md
  followup: prompts/fix.md
output:
  path: "results/{{.Unit.slug}}.json"
  format: json
  require_fresh: true
validate:
  command: ["python3", "./check.py", "{{.Output}}"]
  timeout: 2m
  rounds: 3
  weak_after: 2
compact:
  ctx_above: 150000
  every_units: 0
timeouts:
  start: 3m
  unit: 40m
notify: none
# Optional supervision and token budget (see docs/workflow.md).
supervise:
  breaker:
    failures: 3
    open_for: 15m
  meltdown:
    failures: 5
    window: 30m
budget:
  unit_tokens: 2000000
  run_tokens: 50000000
  cache_read_percent: 10
# Optional human approval gate (see Approval gates in docs/workflow.md):
# units whose result is listed wait for bp workflow approve/reject.
# approve:
#   on: [weak, failed]
# Optional guardrails on tool activity (see Guardrails in docs/workflow.md).
# Claude Code agents only; bp never interrupts a working agent, a halt ends
# the unit at its next idle boundary instead of sending a follow-up.
# guardrails:
#   tool_calls:
#     warn: 150
#     halt: 400
#   repeated_tool_call:
#     warn: 5
#     halt: 10
#   tool_failures:
#     warn: 5
#     halt: 12
#     tool: Bash
