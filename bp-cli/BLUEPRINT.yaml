# bp - Blueprint Management Tool

_meta:
  version: "0.3.0"
  updated: 2026-01-19
  status: draft
  root: true  # Bu proje root'u - alt paketlerde argümansız komutlar buradan çalışır
  # state_dir: ".blueprint"  # default
  # mode: meek               # default (meek | ro | hide)

# =============================================================================
# PROJECT INFO
# =============================================================================

project:
  name: bp
  tagline: File-system based blueprint authoring and tracking tool
  description: |
    AI destekli yazılım geliştirme için tasarlanmış, BLUEPRINT.yaml dosyalarını
    yöneten, versiyonlayan ve takip eden CLI aracı.

license:
  type: GPL-3.0-or-later
  file: LICENSE
  notice: |
    This program is free software: you can redistribute it and/or modify
    it under the terms of the GNU General Public License as published by
    the Free Software Foundation, either version 3 of the License, or
    (at your option) any later version.

repository:
  url: https://github.com/tunapro1234/blueprint
  issues: https://github.com/tunapro1234/blueprint/issues
  discussions: https://github.com/tunapro1234/blueprint/discussions

author:
  name: Tuna Gül
  github: tunapro1234

# =============================================================================
# INTENT & OVERVIEW
# =============================================================================

intent: |
  Blueprint dosyalarını yöneten, versiyonlayan ve takip eden CLI tool.
  Kod ile dökümentasyon arasındaki tutarlılığı sağlar.

overview: |
  bp, yazılım projelerinde YAML formatında blueprint dosyaları kullanarak
  kod organizasyonunu ve versiyonlamayı yönetir.

  Temel özellikler:
  - Blueprint validation ve schema kontrolü
  - Hash-based snapshot sistemi (slug-hash / ss-hash formatı)
  - Dependency tracking ve reverse tracking
  - Dependency pinning ve upgrade yönetimi
  - Çoklu dil kökleri için new-lang desteği (default src/ + config)

# =============================================================================
# PLAN
# =============================================================================

plan:
  - id: state_dir_config
    status: done
    desc: _meta.state_dir ile state dizini ayarlanabilir; bu repo varsayılan .blueprint kullanır.
  - id: snapshot_imports
    status: done
    desc: Snapshot history içinde dependency symlink'leri olacak şekilde güncellendi (impl/deps yok).
  - id: docs_update
    status: done
    desc: README ve blueprint/spec dokümanları state_dir için güncellendi.
  - id: tests_exclude_state_dir
    status: done
    desc: Verification komutları state dizinini test kapsamı dışında bırakır.
  - id: gitignore_state_dir
    status: done
    desc: state dizinini (.blueprint/) gitignore'a ekle.

# =============================================================================
# WORKFLOW POLICY
# =============================================================================

dependency_policy:
  summary: |
    Symlink tabanlı dependency yönetimi (yeni yapı):
    - Working tree (paket klasörü) edit alanıdır
    - Working tree'de dependency klasörü varsa symlink oluşturulmaz (gerçek klasör)
    - Snapshot'ta kod + dependency symlink'leri direkt bulunur (impl/, deps/ yok)
    - {dep_name}/ → dependency'nin pinned snapshot'ına symlink (snapshot history içinde)
    - bp upgrade pinleri günceller; symlink'ler snapshot'ta oluşur

language_policy:
  summary: |
    Multi-language kökler:
    - Varsayılan kök: src/
    - Ek kökler language_roots ve language_root_patterns ile bulunur (default pattern: src-*)
    - new-lang komutu paket ağacını oluşturur; API section içeren blueprint'ler symlink, diğerleri kopya
    - Tek blueprint dosyası API+spec içeriyorsa split için sorar (evet ise api/spec ayrılır)
    - Implementasyonlar diller arasında kopyalanmaz (bağımsız)
    - API hash eşitliği map --langs ile kontrol edilir
  default_root: src
  # default_language: go
  language_root_template: src-{lang}
  # language_roots:
  #   - src
  language_root_patterns:
    - src-*
  blueprint_patterns:
    - BLUEPRINT.yaml
    - .BLUEPRINT.yaml
    - BLUEPRINT.*.yaml
    - .BLUEPRINT.*.yaml
    - "*.BP.yaml"
    - "*.bp.yaml"

# =============================================================================
# PROJECT STRUCTURE
# =============================================================================

structure:
  directories:
    src/:
      desc: Varsayılan dil kökü
      has_blueprint: true
    src-*/:
      desc: Ek dil kökleri (örn. src-go, src-rs)
      has_blueprint: true
    .blueprint/:
      desc: bp tool'un internal state'i (history, snapshots, state)
      managed_by: bp tool
    .git/:
      desc: Git version control

  files:
    LICENSE:
      desc: GNU General Public License v3.0
      managed_by: project
      rules:
        - NEVER_MODIFY: Lisans dosyası değiştirilmemeli

    README.md:
      desc: Proje açıklaması ve kullanım kılavuzu
      structure:
        - "Notes from the dev" section (en üstte)
        - Proje açıklaması
        - Kurulum ve kullanım
        - Komut referansı
      rules:
        - NEVER_DELETE: "Notes from the dev" section - Bu bölüm geliştiricinin kişisel notlarını içerir ve AI tarafından ASLA silinmemeli veya değiştirilmemeli
        - Bu section'ın içeriği sadece geliştirici tarafından düzenlenir
    .gitignore:
      desc: Git tarafından ignore edilecek dosyalar
    bp:
      desc: Derlenmiş binary (gitignore'da)
    todo.md:
      desc: Geçici notlar (gitignore'da olabilir)
      rules:
        - AI bu dosyayı okuyabilir ama içeriğini silmemeli
        - Yeni item eklenebilir, mevcut itemlar kullanıcı onayı olmadan silinmez

# =============================================================================
# BUILD & RUN
# =============================================================================

build:
  command: "cd src && go build -o ../bp ./cmd/bp"
  output: "./bp"
  requirements:
    - Go 1.22+

usage:
  examples:
    - "bp validate"
    - "bp validate"
    - "bp status"
    - "bp plan"
    - "bp cancel"
    - "bp impl"
    - "bp impl --no-snapshot"
    - "bp ss -m 'Initial snapshot'"
    - "bp new-lang rs"
    - "bp upgrade --all"
    - "bp deps --upgrades"

# =============================================================================
# WORKFLOW
# =============================================================================

workflow:
  summary: |
    Önerilen akış:
    1) Önce BLUEPRINT.yaml / BLUEPRINT.spec.yaml güncellenir
    2) bp plan ile leaf-first sıra çıkarılır (default recursive)
    3) Her paket için: bp impl (agentic derleme + snapshot) veya bp ss (manual snapshot)
    3.5) Yeni dil kökü gerekiyorsa: bp new-lang <lang> --from <lang>
    4) Mode'a göre davranış:
       - meek (default): hiçbir şey değişmez
       - ro: dosyalar read-only olur
       - hide: kod dosyaları silinir
  notes:
    - BLUEPRINT dosyaları snapshot sonrası working tree'de kalır
    - impl.lock sadece derleme sırasında "busy" flag'dir
    - Importlar working tree'de gerçek dependency klasörlerinden yapılır (deps/ yok)
    - bp upgrade pinleri günceller, symlink'ler snapshot'ta oluşur
    - Snapshot içindeki tüm dosyalar read+execute (chmod 0555, symlink hariç)
  symlink_structure: |
    Snapshot yapısı (impl/, deps/ yok):
    .blueprint/history/{id}/
    ├── BLUEPRINT.yaml
    ├── meta.yaml
    ├── main.go
    ├── util.go
    ├── yamlparser/ → ../../yamlparser/.blueprint/history/{pinned_id}/
    └── commands/ → ../../commands/.blueprint/history/{pinned_id}/

# =============================================================================
# AI GUIDELINES
# =============================================================================

ai_rules:
  protected_content:
    - section: "Notes from the dev"
      file: README.md
      rule: NEVER_DELETE
      reason: Geliştiricinin kişisel notları, AI tarafından değiştirilemez

    - section: Mevcut todo itemları
      file: todo.md
      rule: PRESERVE
      reason: Kullanıcı onayı olmadan silinmez, sadece yeni ekleme yapılabilir

  general:
    - Blueprint dosyaları spec ile tutarlı tutulmalı
    - Kod değişikliği yaparken ilgili blueprint'i de güncelle
    - Yeni özellik eklerken önce blueprint'e yaz, sonra implement et

# =============================================================================
# DEPENDENCIES
# =============================================================================

# =============================================================================
# IMPLEMENTATION
# =============================================================================

implementation:
  structure:
    - README.md
    - LICENSE
    - .gitignore
    - AGENTS.md
    - todo.md
    - src/:
        has_blueprint: true

dependencies:
  internal:
    - path: ./src
      desc: Ana kaynak kod ve library
