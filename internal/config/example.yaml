# bp settings — changes are read by the next bp command.
# File: ~/.blueprint/config.yaml (or that directory when BP_HOME is set).
# Relative paths are resolved from this file's directory; ~/ is the home directory.
# Do not use this together with config.json or config.yml; select one active file.

agentbooks: [agentbook.json]
msgqRoot: msgq
stateDir: state

# Local CLI session/model/context observation. Conversations stay in their native CLI directory.
localObservation: true

# Mouse scrolling and selection in local bp tmux sessions.
localMouse: true

# Throwaway agents launched through bp run are archived after they close.
# bp open remains persistent unless --ephemeral is supplied.
lifecycle:
  ephemeralDefault: true
  archiveOnClose: true

# Bottom bar: list order is display order. [] hides every widget.
# ctx: context, temp: cache estimate/measurement age, queue: waiting messages,
# model: model/effort, quota: quota used, talk: latest-message age, clock: time.
bar:
  # defaultColor: purple # computer default; per-agent bp color takes precedence
  context: used # context used; select remaining for the amount left
  widgets: [ctx, temp, queue, model, quota]

# Optional integrations are disabled by default.
waBridge: false
# usageHistory: ~/usage/history.jsonl
# codex:
#   sockets: [~/.codex/app-server-control/app-server-control.sock]
# ntfy:
#   url: https://ntfy.example.com
#   topic: bp
#   token: ""

# Validate: bp config check
# Active file: bp config path

# Check signed releases in the background at most daily; never starts a model turn.
updateCheck: true

# P2P is opt-in. First print this machine's public identity: bp p2p id
# See docs/p2p.md for peer allowlists and rendezvous configuration.
# p2p:
#   enabled: true
#   mdns: false
#   rendezvous: [/dns4/your-relay.example/tcp/443/wss/p2p/RELAY_PEER_ID]
#   peers:
#     laptop:
#       id: LAPTOP_PEER_ID
#       expose: [main] # only these LOCAL agents may receive from laptop

# Interactive remote terminals are separate from P2P message peers.
# remotes:
#   server:
#     host: server.example
#     port: 22
#     user: tuna
#     identity: ~/.ssh/server
#     transport: mosh # mosh or ssh
#     moshPorts: 60000:61000
#     elevate: sudo -i
