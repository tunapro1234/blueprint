# bp - Blueprint Management Tool

_meta:
  version: "0.1.0"
  updated: 2025-01-15
  status: draft

intent: Blueprint dosyalarını yöneten, versiyonlayan ve takip eden CLI tool

overview: |
  bp tool, YAML formatındaki blueprint dosyalarını yönetir.

  Temel konseptler:
  - Her klasör bir paket
  - Alt klasörler implicit dependency
  - BLUEPRINT.yaml kullanıcı düzenler
  - .blueprint/ tool yönetir (state, history)

  Komutlar:
  - bp validate: YAML syntax + schema check
  - bp status: Kod değişmiş mi? (son snapshot'a göre)
  - bp deps: Dependency graph
  - bp init: Yeni blueprint oluştur
  - bp log: Snapshot geçmişi
  - bp diff: İki snapshot arasındaki fark
  - bp show: Belirli snapshot'ın blueprint'ini göster
  - bp ss: Snapshot al (testler geçerse kaydet)
  - bp implement: Worker için iş oturumu başlat
  - bp work: Aktif work session'ları listele/oku

# =============================================================================
# API
# =============================================================================

api:
  cli:
    name: bp
    usage: bp <command> [path] [flags]

    commands:
      - name: validate
        desc: YAML syntax ve schema kontrolü
        usage: bp validate [path] [-r|--recursive]
        args:
          - name: path
            default: "."
            desc: Blueprint dosyası veya klasör
        flags:
          - name: -r, --recursive
            desc: Alt klasörleri de tara
        output:
          success: "✓ {path}"
          warning: "⚠ {path}: {message}"
          error: "✗ {path}: {message}"
        exit_codes:
          0: Valid
          1: Error var
          2: Sadece warning

      - name: status
        desc: Kod ve dependency değişiklik kontrolü
        usage: bp status [path] [-r]
        flags:
          - name: -r, --recursive
            desc: Alt klasörleri de kontrol et
        output:
          fresh: "✓ {path} (fresh)"
          stale: "⚠ {path} (stale, {n} files changed)"
          deps_stale: "⚠ {path} (deps changed: {dep_names})"
          no_state: "○ {path} (no snapshot)"
        exit_codes:
          0: Fresh (değişiklik yok)
          1: Stale (kod veya dependency değişmiş)
          2: No snapshot (henüz ss alınmamış)
        staleness_sources: |
          Stale durumu şu kaynaklardan gelebilir:
          1. Kendi dosyaları değişmiş (mevcut davranış)
          2. BLUEPRINT.yaml değişmiş (mevcut davranış)
          3. Dependency'nin impl_hash'i değişmiş
          4. Dependency'nin api section'ı değişmiş

      - name: deps
        desc: Dependency graph göster
        usage: bp deps [path]
        output: |
          Topological sırada dependency listesi:
          1. leaf/package
          2. mid/package
          3. root/package (current)
        exit_codes:
          0: Başarılı
          1: Circular dependency veya hata

      - name: init
        desc: Yeni BLUEPRINT.yaml oluştur
        usage: bp init [path]
        behavior:
          - Zaten varsa hata ver, üzerine yazma
          - Template BLUEPRINT.yaml oluştur
        exit_codes:
          0: Oluşturuldu
          1: Zaten var veya hata

      - name: log
        desc: Snapshot geçmişi
        usage: bp log [path] [-n count]
        flags:
          - name: -n, --count
            default: 10
            desc: Gösterilecek snapshot sayısı
        output: |
          a1b2c3d4e5f6 2025-01-15 10:30 "Add validation logic"
          9f8e7d6c5b4a 2025-01-14 15:00 "Fix edge cases"
          1234abcd5678 2025-01-13 09:00 "Initial snapshot"
        exit_codes:
          0: Başarılı (boş geçmiş dahil)
          1: Hata

      - name: diff
        desc: İki snapshot arasındaki blueprint farkı
        usage: bp diff [path] [id1] [id2]
        behavior:
          - Argüman yok: current blueprint vs son snapshot
          - Tek ID: o snapshot vs current blueprint
          - İki ID: iki snapshot'ın blueprint'leri karşılaştırılır
        output: |
          Unified diff formatı (--- / +++ / @@ ile)
          Fark yoksa "No changes" mesajı
        exit_codes:
          0: Başarılı (fark var veya yok)
          1: ID bulunamadı veya hata

      - name: show
        desc: Belirli snapshot'ın blueprint'ini göster
        usage: bp show [path] [id]
        behavior:
          - ID verilmezse son snapshot
          - .blueprint/history/XXXX/BLUEPRINT.yaml içeriğini stdout'a yazar
        exit_codes:
          0: Başarılı
          1: ID bulunamadı veya hata

      - name: ss
        desc: Snapshot al - testleri çalıştır, geçerse kaydet
        usage: bp ss [path] [-m "message"] [--skip-tests]
        flags:
          - name: -m, --message
            desc: Snapshot mesajı (opsiyonel, yoksa tarih kullanılır)
          - name: --skip-tests
            desc: Testleri atla, direkt kaydet
        behavior:
          - Blueprint'i validate et (hata varsa exit 2)
          - Dependency'lerin snapshot durumunu kontrol et
          - tests.verification komutlarını çalıştır (varsa)
          - Testler geçerse:
            - Content hash hesapla (blueprint + impl + deps_hash)
            - .blueprint/history/{hash}/ oluştur (hash = ilk 12 karakter)
            - BLUEPRINT.yaml snapshot'ı kaydet
            - meta.yaml oluştur (id, timestamp, message, impl_hash, deps_hash)
            - state.yaml güncelle (dosya hash'leri + dep bilgileri)
            - .blueprint/current güncelle (yeni hash ID)
          - Testler geçmezse hata ver, snapshot alma
        exit_codes:
          0: Snapshot alındı
          1: Testler başarısız
          2: Validation hatası

      - name: implement
        desc: Worker için izole çalışma oturumu başlat
        usage: bp implement [path] [-r] [--list] [--done SESSION]
        flags:
          - name: -r, --recursive
            desc: Alt paketleri de dahil et
          - name: --list
            desc: Aktif work session'ları listele
          - name: --done SESSION
            desc: Session'ı tamamlandı olarak işaretle
        behavior: |
          1. Stale olan blueprint'leri tespit et (bp status -r ile)
          2. Benzersiz session ID oluştur (timestamp + random, örn "20260116-a1b2")
          3. .blueprint/work/{session_id}/ klasörü oluştur
          4. Her stale blueprint için:
             - BLUEPRINT.yaml'ı work klasörüne kopyala
             - Mevcut implementasyonu da kopyala (referans için)
          5. work/manifest.yaml oluştur (hangi paketler, ne zaman)
          6. Session ID'yi stdout'a yaz

          Worker bu session ID ile çalışır:
          - Blueprint'leri .blueprint/work/{session}/ içinden okur
          - Ana BLUEPRINT.yaml'ı DEĞİŞTİRMEZ
          - Kullanıcı ana dosyaları düzenlemeye devam edebilir
        output:
          success: "Work session started: {session_id}"
          list: |
            Active sessions:
            20260116-a1b2  3 packages  2h ago
            20260115-x9y8  1 package   1d ago
        exit_codes:
          0: Session oluşturuldu veya listelendi
          1: Hata
          2: Stale paket yok (implement edilecek bir şey yok)

      - name: work
        desc: Work session bilgilerini oku
        usage: bp work <session_id> [--blueprints] [--status]
        flags:
          - name: --blueprints
            desc: Session'daki blueprint'leri listele
          - name: --status
            desc: Session durumunu göster
        behavior: |
          Session içindeki blueprint'leri ve durumu gösterir.
          Worker bu komutu kullanarak ne yapması gerektiğini öğrenir.
        output: |
          Session: 20260116-a1b2
          Created: 2026-01-16 10:30
          Packages:
            ./commands (stale, 3 files changed)
            ./yamlparser (stale, api changed)
        exit_codes:
          0: Başarılı
          1: Session bulunamadı

  library:
    note: |
      Aşağıdaki tipler language-agnostic tanımlanmıştır.
      Implementasyon diline göre class, struct, record, interface vb. kullanılabilir.

    types:
      - name: Blueprint
        desc: Tek BLUEPRINT.yaml dosyasını temsil eder
        fields:
          - name: path
            type: string
            desc: BLUEPRINT.yaml dosyasının tam yolu
          - name: data
            type: map<string, any>
            desc: Parse edilmiş YAML içeriği
          - name: state_dir
            type: string
            desc: .blueprint/ klasörünün yolu
        methods:
          - name: validate
            returns: ValidationResult
            desc: YAML syntax + schema check
          - name: is_stale
            returns: bool?
            desc: Kod değişmiş mi? (null = snapshot yok)
          - name: get_changed_files
            returns: string[]
            desc: Değişen dosyaların listesi
          - name: get_section
            args: [section: string]
            returns: map<string, any>?
            desc: api, implementation, tests bölümünü al
          - name: get_history
            returns: HistoryEntry[]
            desc: Snapshot geçmişi
          - name: save_state
            returns: void
            desc: .blueprint/state.yaml güncelle

      - name: HistoryEntry
        desc: Tek bir snapshot kaydı
        fields:
          - name: id
            type: string
            desc: Content hash (ilk 12 karakter), örn "a1b2c3d4e5f6"
          - name: timestamp
            type: string
            desc: ISO 8601 format
          - name: message
            type: string
            desc: Snapshot mesajı
          - name: impl_hash
            type: string
            desc: Implementation dosyalarının birleşik hash'i
          - name: deps_hash
            type: string
            desc: Dependency'lerin snapshot hash'lerinin birleşimi

      - name: BlueprintTree
        desc: Klasör hiyerarşisindeki tüm blueprint'ler
        fields:
          - name: root
            type: string
            desc: Root klasör yolu
        methods:
          - name: walk
            returns: Blueprint[]
            desc: Tüm blueprint'leri listele (iterable)
          - name: resolve_deps
            args: [bp: Blueprint]
            returns: Blueprint[]
            desc: Bir blueprint'in dependency'lerini bul
          - name: topological_sort
            returns: Blueprint[]
            desc: Dependency sırasına göre sırala

      - name: ValidationResult
        desc: Validation sonucu
        fields:
          - name: valid
            type: bool
            desc: Geçerli mi?
          - name: errors
            type: string[]
            desc: Hata mesajları
          - name: warnings
            type: string[]
            desc: Uyarı mesajları

      - name: WorkSession
        desc: Worker için izole çalışma oturumu
        fields:
          - name: id
            type: string
            desc: Session ID, örn "20260116-a1b2"
          - name: created
            type: string
            desc: ISO 8601 timestamp
          - name: packages
            type: WorkPackage[]
            desc: Bu session'da çalışılacak paketler
          - name: status
            type: string
            desc: "active" | "done" | "abandoned"

      - name: WorkPackage
        desc: Work session içindeki tek paket
        fields:
          - name: path
            type: string
            desc: Paketin orijinal yolu (örn "./commands")
          - name: work_path
            type: string
            desc: Work klasöründeki yolu
          - name: reason
            type: string
            desc: Neden implement edilmesi gerekiyor
          - name: blueprint_hash
            type: string
            desc: Kopyalanan blueprint'in hash'i

# =============================================================================
# DEPENDENCIES
# =============================================================================

dependencies:
  internal:
    - path: ./yamlparser
      desc: Blueprint-aware YAML parser (fallback destekli)
    - path: ./commands
      desc: CLI komut handler'ları

# =============================================================================
# IMPLEMENTATION
# =============================================================================

implementation: "./BLUEPRINT.spec.yaml"

# =============================================================================
# TESTS
# =============================================================================

tests: "./BLUEPRINT.spec.yaml"
