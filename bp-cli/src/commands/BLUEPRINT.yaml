# bp/commands - CLI Komutları

_meta:
  version: "0.2.0"
  updated: 2026-01-17
  status: ready
  state_dir: "blueprint"

intent: bp CLI'ın her komutunu ayrı modül olarak implement eder

overview: |
  Her komut ayrı dosyada, ortak interface ile.
  Registry pattern ile komutlar dinamik yüklenir.

# =============================================================================
# PLAN
# =============================================================================

plan:
  - id: tests_exclude_state_dir
    status: done
    desc: tests.verification komutları state dizinini test kapsamı dışında bırakır.
  - id: state_dir_config
    status: done
    desc: _meta.state_dir ile state dizini bu paket için ayarlanır.

# =============================================================================
# WORKFLOW POLICY
# =============================================================================

dependency_policy:
  summary: |
    Symlink tabanlı dependency yönetimi:
    - Paket klasörü sadece edit alanıdır
    - deps/{dep_name}/ → dependency'nin pinned snapshot impl'ine symlink
    - Import/build için deps/ klasöründeki symlinkler kullanılır

dependencies:
  from_parent:
    - Blueprint         # core - tek BLUEPRINT.yaml temsili
    - BlueprintTree     # core - klasör hiyerarşisi
    - HistoryEntry      # core - snapshot geçmişi entry'si
    - ValidationResult  # core - validation sonucu
    - DepState          # core - dependency pin durumu
    - DepRef            # core - reverse dependency bilgisi

# =============================================================================
# API
# =============================================================================

api:
  exports:
    - name: COMMANDS
      type: "map<string, CommandHandler>"
      desc: "Komut adı → handler mapping"
      example: |
        {
          "validate": validate_command,
          "status": status_command,
          "plan": plan_command,
          "cancel": cancel_command,
          "apply": apply_command,
          "deps": deps_command,
          "map": map_command,
          "init": init_command,
          "log": log_command,
          "diff": diff_command,
          "show": show_command,
          "implement": implement_command,
          "impl": implement_command,
          "upgrade": upgrade_command,
        }

    - name: CommandHandler
      type: interface
      desc: Her komut handler'ının implement ettiği interface
      signature: "(ctx: CommandContext) -> CommandResult"

    - name: CommandContext
      desc: Komuta geçirilen tüm context
      fields:
        - path: string                  # Hedef path (default: cwd)
        - blueprint: Blueprint?         # Tek blueprint (varsa)
        - tree: BlueprintTree?          # Tree (recursive için)
        - args: map<string, any>        # Komut-spesifik argümanlar
      note: |
        path her zaman ctx.path üzerinden gelir (CLI'dan parse edilir).
        args sadece komut-spesifik flag'ler için:
        - validate: {recursive: bool}
        - status: {recursive: bool}
        - plan: {recursive: bool}
        - cancel: {}
        - apply: {message: string?, skip_tests: bool}
        - deps: {upgrades: bool}        # --upgrades flag
        - init: {}                      # Ek args yok, path ctx.path'te
        - log: {count: int}             # default: 10
        - diff: {id1: string?, id2: string?}
        - show: {id: string?}           # null = son snapshot
        - implement: {snapshot_id: string?, clean: bool}
        - impl: {snapshot_id: string?, clean: bool}  # alias
        - upgrade: {dep_path: string?, safe: bool, all: bool}

    - name: CommandResult
      fields:
        - exit_code: int
        - output: string                # Human-readable output
        - data: any                     # Structured data (opsiyonel)
        - errors: string[]
      note: |
        data field komuta göre:
        - validate: ValidationResult
        - status: StatusInfo
        - plan: PlanResult
        - cancel: null
        - apply: SnapshotInfo
        - deps: string[] (topological order) veya DepUpgrade[] (--upgrades)
        - log: HistoryEntry[]
        - diff: DiffResult
        - show: string (blueprint content)
        - init: null
        - implement: ImplementResult
        - upgrade: UpgradeResult

    - name: DiffResult
      fields:
        - has_changes: bool
        - left_id: string               # "current" veya snapshot ID
        - right_id: string              # "current" veya snapshot ID
        - unified_diff: string          # unified diff formatında fark

    - name: StatusInfo
      fields:
        - state: string                 # "fresh" | "stale" | "no_snapshot"
        - changed_files: string[]       # Değişen dosya listesi (stale ise)
        - changed_deps: string[]        # Değişen dependency'ler
        - stale_reason: string?         # "files_changed" | "blueprint_changed" | "deps_changed" | "deps_api_changed"
        - dep_updates: DepUpgrade[]     # Upgrade mevcut dependency'ler
        - dependents: DepRef[]          # Kim bize bağlı (reverse tracking)
        - implementing: bool            # Aktif implementasyon var mı? (impl.lock)
        - impl_hidden: bool             # Working tree gizli mi? (impl.hidden)
        - working_clean: bool           # Working tree'de tracked değişiklik yok mu?
        - blueprint_changed: bool       # BLUEPRINT.yaml değişmiş mi?
        - api_changed: bool             # API section hash değişmiş mi?
        - spec_changed: bool            # Implementation spec hash değişmiş mi?

    - name: PlanStep
      fields:
        - path: string                  # Blueprint path (relative)
        - state: string                 # "stale" | "no_snapshot"
        - reason: string                # "files_changed" | "blueprint_changed" | "deps_changed" | "deps_api_changed"

    - name: PlanResult
      fields:
        - steps: PlanStep[]             # Leaf-first sıralı adımlar

    - name: SnapshotInfo
      fields:
        - id: string                    # Snapshot ID, örn "20260116-1430-a1b2-add-feat"
        - path: string                  # blueprint/history/{id}/
        - content_hash: string          # Tam content hash
        - api_hash: string              # API section hash
        - spec_hash: string             # Implementation section hash
        - impl_hash: string             # Implementation dosyalarının hash'i

    - name: ImplementResult
      fields:
        - ready: bool                   # Implementation başlatılabilir mi?
        - deps: DepState[]              # Pin'lenmiş dependency'ler
        - missing_deps: string[]        # Snapshot'ı olmayan dependency'ler

    - name: UpgradeResult
      fields:
        - upgraded: string[]            # Upgrade edilen dependency'ler
        - api_changed: string[]         # API değişen dependency'ler (uyarı)
        - skipped: string[]             # --safe ile atlanan dependency'ler

    - name: DepUpgrade
      desc: Upgrade mevcut bir dependency
      fields:
        - path: string                  # Dependency path
        - current: string               # Mevcut pinned snapshot ID
        - latest: string                # En son snapshot ID
        - api_changed: bool             # API değişmiş mi?

# =============================================================================
# DEPENDENCIES
# =============================================================================

dependencies:
  internal:
    - path: ../yamlparser
      desc: YAML parsing için (BLUEPRINT.yaml okuma)

# =============================================================================
# IMPLEMENTATION
# =============================================================================

implementation: "./BLUEPRINT.spec.yaml"

# =============================================================================
# TESTS
# =============================================================================

tests: "./BLUEPRINT.spec.yaml"
