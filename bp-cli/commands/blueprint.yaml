# bp/commands - CLI Komutları

_meta:
  version: "0.1.0"
  updated: 2025-01-15
  status: draft

intent: bp CLI'ın her komutunu ayrı modül olarak implement eder

overview: |
  Her komut ayrı dosyada, ortak interface ile.
  Registry pattern ile komutlar dinamik yüklenir.

# =============================================================================
# API
# =============================================================================

api:
  exports:
    - name: COMMANDS
      type: dict
      desc: "Komut adı → handler mapping"
      example: |
        {
          "validate": validate_command,
          "status": status_command,
          "deps": deps_command,
          "init": init_command,
          "log": log_command,
          "diff": diff_command,
          "show": show_command,
          "implement": implement_command,
        }

    - name: CommandResult
      type: dataclass
      fields:
        - exit_code: int
        - output: str
        - errors: list[str]

  interface:
    desc: Her komut bu interface'i implement eder
    signature: "(args: Namespace, tree: BlueprintTree) -> CommandResult"

# =============================================================================
# IMPLEMENTATION
# =============================================================================

implementation:
  structure:
    - __init__.py
    - validate.py
    - status.py
    - deps.py
    - init.py
    - log.py
    - diff.py
    - show.py
    - implement.py

  decisions:
    - q: Neden her komut ayrı dosya?
      a: Kolay test, kolay extend. Yeni komut = yeni dosya.

    - q: Registry nasıl çalışıyor?
      a: __init__.py'da COMMANDS dict'i, her dosyadan import.

# =============================================================================
# TESTS
# =============================================================================

tests:
  scenarios:
    - id: validate_returns_result
      given: Herhangi bir blueprint
      when: validate_command çağrılır
      then: CommandResult döner

    - id: unknown_command
      given: COMMANDS'ta olmayan komut
      when: bp xyz
      then: "Unknown command" hatası

    - id: command_error_handling
      given: Komut exception fırlatır
      when: Çalıştırılır
      then: Graceful error, stack trace değil

  verification:
    - Her komut CommandResult döndürür
    - Her komut aynı signature'a sahip
    - COMMANDS dict'i tüm komutları içerir
