# =============================================================================
# API
# =============================================================================

api:
  cli:
    name: bp
    usage: bp <command> [path] [flags]

    defaults:
      state_dir: ".blueprint"
      mode: meek  # meek | ro | hide

    modes: |
      Development mode'lar (_meta.mode ile ayarlanır, default: meek):

      meek (default):
        - Hiçbir şeyi zorlamaz
        - Working tree her zaman aktif
        - bp impl: derleme sırasında impl.lock "busy" flag
        - bp ss: snapshot alır, çalışma dizinine dokunmaz

      ro:
        - Read-only enforcement
        - bp impl: derleme boyunca dosyaları writable yapar, sonra read-only'e geri döner
        - bp ss: snapshot alır, izinleri değiştirmez
        - idle durumda dosyalar read-only

      hide:
        - Kodları gizle/göster
        - bp impl: derleme için kodları görünür yapar, sonra tekrar gizler
        - bp ss: mevcut working tree'yi snapshot'lar (hide'da kod yoksa boş olabilir)

    root_resolution: |
      Root blueprint kavramı:
      - _meta.root: true olan blueprint proje root'udur
      - Alt paketlerde argümansız komut çalıştırıldığında:
        1. Yukarı doğru parent klasörlerde blueprint aranır
        2. _meta.root: true olan ilk blueprint root olarak belirlenir
        3. Root bulunamazsa en üstteki blueprint root sayılır
        4. Komut root'tan recursive çalıştırılır
      - Explicit path verilirse o path'ten recursive çalışır
      - --no-recursive ile sadece tek paket hedeflenir

      Örnekler:
        bp validate              → root bul, root'tan recursive
        bp validate .            → bulunulan paketten recursive
        bp validate ./src        → ./src'den recursive
        bp validate --no-recursive     → root bul, sadece root paketi
        bp validate . --no-recursive   → sadece bulunulan paket
        bp status                → root bul, root'tan recursive
        bp status .              → bulunulan paketten recursive
        bp status . --no-recursive     → sadece bulunulan paket

    commands:
      - name: validate
        desc: YAML syntax ve schema kontrolü
        usage: bp validate [path] [--no-recursive]
        args:
          - name: path
            default: "."
            desc: Blueprint dosyası veya klasör
        flags:
          - name: -nr, --no-recursive
            desc: Sadece verilen paketi kontrol et
        line_limits:
          api: 300              # Soft limit - aşılırsa warning
          implementation: 900   # Soft limit - aşılırsa warning
        output:
          success: "✓ {path}"
          warning: "⚠ {path}: {message}"
          error: "✗ {path}: {message}"
          line_warning: "⚠ {path}: {section} exceeds {limit} lines ({actual} lines)"
        exit_codes:
          0: Valid
          1: Error var
          2: Sadece warning (intent eksik, satır limiti aşımı)

      - name: status
        desc: Kod, dependency ve dependent değişiklik kontrolü
        usage: bp status [path] [--no-recursive]
        flags:
          - name: -nr, --no-recursive
            desc: Sadece verilen paketi kontrol et
        output:
          fresh: "✓ {path} (fresh)"
          stale: "⚠ {path} (stale, {n} files changed)"
          deps_stale: "⚠ {path} (deps changed: {dep_names})"
          deps_upgrade: "⚠ {dep}: {pinned} → {latest}"
          deps_upgrade_api: "⚠ {dep}: {pinned} → {latest} (API CHANGED!)"
          no_state: "○ {path} (no snapshot)"
          implementing: "⧗ {path} (implementing)"
          read_only: "🔒 {path} (read-only)"
          dependents: |
            Dependents:
              ../consumer using old-xxxx (OUTDATED - 2 behind)
              ../other using new-yyyy (current)
        exit_codes:
          0: Fresh (değişiklik yok)
          1: Stale (kod veya dependency değişmiş)
          2: No snapshot (henüz snapshot alınmamış)
        staleness_sources: |
          Stale durumu şu kaynaklardan gelebilir:
          1. Kendi dosyaları değişmiş (files_changed)
          2. BLUEPRINT.yaml değişmiş (blueprint_changed)
          3. Dependency'nin snapshot'ı değişmiş - pinned != latest (deps_changed)
          4. Dependency'nin api_hash'i değişmiş (deps_api_changed, daha kritik)
        status_flags: |
          Ayrı flag'ler (staleness reason'a eklenmez):
          - implementing: impl.lock var mı? (derleme sırasında)
          - read_only: ro mode'da idle ise read-only mi?
          - working_clean: tracked dosyalarda değişiklik yok mu?
          - blueprint_changed: BLUEPRINT.yaml hash değişmiş mi?
          - api_changed: API section hash değişmiş mi?
          - spec_changed: Implementation section hash değişmiş mi?

      - name: plan
        desc: Değişen paketleri dependency sırasına göre listeler (leaf-first)
        usage: bp plan [path] [--no-recursive]
        flags:
          - name: -nr, --no-recursive
            desc: Sadece verilen paketi planla
        behavior: |
          - Default recursive; --no-recursive sadece verilen path'i tarar
          - Dependency graph'e göre leaf-first sıralar
          - Sadece stale veya no_snapshot paketleri listeler
        output: |
          1. ./yamlparser (no snapshot)
          2. ./commands (stale, blueprint_changed)
          3. . (stale, deps_changed)
        exit_codes:
          0: Başarılı (liste boş olabilir)
          1: Hata (circular dependency veya okuma hatası)

      - name: cancel
        desc: Aktif derlemeyi iptal eder (busy flag temizler)
        usage: bp cancel [path]
        behavior: |
          - impl.lock yoksa hata verir
          - impl.lock varsa silinir
          - Mode'a göre:
            - ro: dosyaları read-only yap
            - hide: dosyaları temizle
            - meek: hiçbir şey yapma
        output:
          success: "Compilation cancelled."
          no_active: "No active compilation."
        exit_codes:
          0: Başarılı
          1: Aktif implementasyon yok veya hata

      - name: ss
        desc: Manuel snapshot al (her zaman çalışır)
        usage: bp ss [path] [-m "message"] [--skip-tests]
        flags:
          - name: -m, --message
            desc: Snapshot mesajı
          - name: --skip-tests
            desc: tests.verification adımını atla
        behavior: |
          - Blueprint validate edilir (error varsa exit 2)
          - tests.verification komutları çalıştırılır (--skip-tests ile atlanır)
          - Snapshot oluşturulur (history/{id}/)
            - BLUEPRINT.yaml kopyalanır
            - meta.yaml oluşturulur
            - Kod dosyaları kopyalanır (direkt, impl/ yok)
            - Symlink'ler kopyalanır (direkt, deps/ yok)
            - history/{id}/ altındaki tüm dosyalar read+execute yapılır (chmod 0555, symlink hariç)
          - state.yaml ve current güncellenir
          - Working tree'ye dokunulmaz
        output:
          success: "Snapshot created: {id}"
        exit_codes:
          0: Başarılı
          1: Testler başarısız veya hata
          2: Validation hatası

      - name: new-lang
        desc: Yeni dil kökü oluştur (default_root + language_root_template)
        usage: bp new-lang <lang> [--from <lang>] [--root <path>] [--target <dir>]
        flags:
          - name: --from
            desc: Kaynak dil (varsayılan: default_root veya bulunan ilk kök)
          - name: --root
            desc: Root path override (default: root blueprint)
          - name: --target
            desc: Hedef klasör (default: language_root_template)
        behavior: |
          - Root blueprint bulunur (veya --root kullanılır)
          - Kaynak dil kökü seçilir (ad/path eşleşmesi, default_root veya pattern'lar)
          - Hedef kök oluşturulur (varsa hata)
          - Kaynak kökteki package ağacı kopyalanır:
            - Her paket için klasör oluşturulur
            - API section içeren blueprint dosyaları symlink edilir, diğerleri kopyalanır (pattern bazlı)
            - Tek blueprint dosyası API+spec içeriyorsa split için sorulur (evet ise api/spec ayrılır)
            - Implementation dosyaları kopyalanmaz
          - Kaynak kökte blueprint olmayan klasörler dosya/dizin olarak kopyalanır (shared assets)
          - Languages listesi varsa güncellenir (yoksa dokunulmaz)
        output:
          success: "Language root created: {target}"
        exit_codes:
          0: Başarılı
          1: Kaynak bulunamadı / hedef zaten var / hata

      - name: deps
        desc: Dependency graph göster
        usage: bp deps [path] [--upgrades]
        flags:
          - name: --upgrades
            desc: Upgrade mevcut dependency'leri göster
        output:
          graph: |
            Topological sırada dependency listesi:
            1. leaf/package
            2. mid/package
            3. root/package (current)
          upgrades: |
            ./yamlparser: old-xxxx → new-yyyy (API CHANGED!)
            ./commands: (up to date)
        exit_codes:
          0: Başarılı
          1: Circular dependency veya hata

      - name: map
        desc: Project map - tüm paketlerin snapshot ve dependency durumu
        usage: bp map [path] [--no-recursive] [--langs]
        flags:
          - name: -nr, --no-recursive
            desc: Sadece verilen paketi göster
          - name: --langs
            desc: Dil kökleri arasında API hash karşılaştırması göster
        behavior: |
          Default recursive olarak tüm paketleri tarar ve her biri için gösterir:
          - Paket adı ve path
          - Current snapshot ID
          - API hash (kısa)
          - Dependency listesi ve pinned snapshot'ları
          - Rotten flag varsa işaretle
          --langs ile language_policy kökleri üzerinden API hash karşılaştırması yapılır
        output:
          format: |
            ./
              snapshot: feature-a1b2
              api: sha256:abc123...
              deps:
                ./yamlparser @ stable-x1y2 (api: def456)
                ./commands @ init-y3z4 (api: ghi789) [ROTTEN]

            ./yamlparser/
              snapshot: stable-x1y2
              api: sha256:def456...
              deps: (none)

            ./commands/
              snapshot: init-y3z4 [ROTTEN]
              api: sha256:ghi789...
              deps:
                ./yamlparser @ stable-x1y2 (api: def456)
          langs: |
            Languages:
              go: src-go

            Package: ./parser
              api_hash:
                go: sha256:abc123...
              status: OK
        exit_codes:
          0: Başarılı
          1: Hata

      - name: init
        desc: Yeni BLUEPRINT.yaml oluştur
        usage: bp init [path]
        behavior:
          - Zaten varsa hata ver, üzerine yazma
          - Template BLUEPRINT.yaml oluştur
        exit_codes:
          0: Oluşturuldu
          1: Zaten var veya hata

      - name: log
        desc: Snapshot geçmişi
        usage: bp log [path] [-n count]
        flags:
          - name: -n, --count
            default: 10
            desc: Gösterilecek snapshot sayısı
        output: |
          add-validation-a1b2   "Add validation logic"
          fix-edge-cases-c3d4   "Fix edge cases"
          ss-a1b2b7c1           "Snapshot"
        exit_codes:
          0: Başarılı (boş geçmiş dahil)
          1: Hata

      - name: diff
        desc: İki snapshot arasındaki blueprint farkı
        usage: bp diff [path] [id1] [id2]
        behavior:
          - Argüman yok: current blueprint vs son snapshot
          - Tek ID: o snapshot vs current blueprint
          - İki ID: iki snapshot'ın blueprint'leri karşılaştırılır
        output: |
          Unified diff formatı (--- / +++ / @@ ile)
          Fark yoksa boş çıktı (stdout'a hiçbir şey yazılmaz)
        exit_codes:
          0: Başarılı (fark var veya yok)
          1: ID bulunamadı veya hata

      - name: show
        desc: Belirli snapshot'ın blueprint'ini göster
        usage: bp show [path] [id]
        behavior:
          - ID verilmezse son snapshot
          - .blueprint/history/XXXX/BLUEPRINT.yaml içeriğini stdout'a yazar
        exit_codes:
          0: Başarılı
          1: ID bulunamadı veya hata

      - name: implement
        desc: Blueprint'i koda derle (agentic) + opsiyonel snapshot
        usage: bp impl [path] [--no-snapshot|-ns]
        note: "Alias: bp implement"
        flags:
          - name: -ns, --no-snapshot
            desc: Snapshot alma (derleme sonrası otomatik ss kapalı)
        behavior: |
          0. Blueprint'i validate et (error varsa exit 2)
          1. Eğer impl.lock varsa hata ver (busy)
          2. impl.lock oluştur (derleme sırasında busy flag)
          3. Blueprint'i oku, dependencies bölümünü kontrol et
          4. Her dependency için:
             - Pin'lenmiş snapshot mevcut mu kontrol et
             - Snapshot yoksa hata: "Dependency {dep} has no snapshot"
             - Dependency'nin state.yaml'ına kendini kaydet (reverse tracking)
          5. Agentic derleme: BLUEPRINT.spec'e göre kodu üret/güncelle
          6. --no-snapshot verilmemişse:
             - ss ile aynı snapshot adımlarını uygula (history/{id}/)
             - Snapshot altındaki tüm dosyalar read+execute yapılır (chmod 0555, symlink hariç)
          7. Mode'a göre idle davranış:
             - meek: hiçbir şey yapma
             - ro: dosyaları read-only yap (chmod -w)
             - hide: kod dosyalarını temizle
          8. impl.lock sil
        output:
          success: |
            Compiled:
              ./yamlparser @ initial-setup-a3f2 ✓
              ./commands   @ cli-init-9f8e ✓
            Snapshot: initial-setup-a3f2
          missing_dep: "✗ Dependency {dep} has no snapshot. Run 'bp ss' in {dep} first."
          no_snapshot: "Compiled (no snapshot)"
        exit_codes:
          0: Başarılı
          1: Dependency snapshot eksik veya derleme hatası
          2: Validation hatası veya blueprint bulunamadı

      - name: upgrade
        desc: Dependency'leri güncelle (pin günceller, test çalıştırır)
        usage: bp upgrade [dep-path] [--safe] [--all] [--force]
        flags:
          - name: --safe
            desc: Sadece API değişmeyenleri upgrade et
          - name: --all
            desc: Tüm dependency'leri upgrade et
          - name: --force
            desc: Rotten snapshot'ları da upgrade et
        behavior: |
          1. dep-path verilmişse sadece o dependency'yi upgrade et
          2. --all verilmişse tüm dependency'leri upgrade et
          3. --safe verilmişse sadece api_changed=false olanları upgrade et
          4. Rotten snapshot'ları atla (--force ile zorla)
          5. Her upgrade için:
             - state.yaml pin bilgisini güncelle
             - tests.verification çalıştır
             - Test fail → rollback + rotten flag
             - Test pass → state.yaml güncelle
          6. API değişikliği varsa uyarı göster
        output:
          success: "Upgraded {dep}: {pinned} → {latest}"
          failed: "Failed {dep}: tests failed, rolled back, marked rotten"
          skipped_rotten: "Skipped {dep}: rotten (use --force)"
          skipped_api: "Skipped {dep}: API changed (use --safe=false)"
        exit_codes:
          0: En az bir upgrade başarılı
          1: Tüm upgrade'ler başarısız veya hata

      - name: remove-lang
        desc: Dil kökünü archive'a taşı
        usage: bp remove-lang <lang>
        args:
          - name: lang
            required: true
            desc: Kaldırılacak dil (go, py, rs, vb.)
        behavior: |
          1. Root blueprint bulunur
          2. Dil kökü bulunur (src-{lang}/ veya language_policy.roots'tan)
          3. Son kalan dil mi kontrol edilir → hata: "Cannot remove last language"
          4. Dil kökü için son bir snapshot alınır
          5. .blueprint/archive/src-{lang}/ oluşturulur
          6. Dil kökü archive'a taşınır:
             - Tüm dosyalar taşınır
             - .blueprint/history/ dahil (snapshotlar korunur)
          7. Archive içine meta.yaml yazılır:
             archived_at: timestamp
             last_snapshot: snapshot-id
             reason: "bp remove-lang {lang}"
          8. Orijinal src-{lang}/ silinir
          9. Root'ta languages listesi varsa güncellenir
        output:
          success: |
            Archived: src-{lang}/ → .blueprint/archive/src-{lang}/
            Last snapshot: {snapshot-id}
          error_last: "Cannot remove last language"
          error_not_found: "Language root not found: {lang}"
        exit_codes:
          0: Başarılı
          1: Dil bulunamadı / son dil / hata

      - name: restore-lang
        desc: Archive'dan dil kökünü geri getir
        usage: bp restore-lang <lang>
        args:
          - name: lang
            required: true
            desc: Geri getirilecek dil (go, py, rs, vb.)
        behavior: |
          1. Root blueprint bulunur
          2. .blueprint/archive/src-{lang}/ kontrol edilir
          3. src-{lang}/ zaten varsa → hata: "Language root already exists"
          4. Archive'dan src-{lang}/ geri taşınır:
             - Tüm dosyalar geri gelir
             - .blueprint/history/ dahil
          5. Archive'daki son snapshot current yapılır
          6. Archive'dan src-{lang}/ silinir
          7. Root'ta languages listesi varsa güncellenir
        output:
          success: |
            Restored: .blueprint/archive/src-{lang}/ → src-{lang}/
            Current snapshot: {snapshot-id}
          error_exists: "Language root already exists: src-{lang}/"
          error_not_found: "No archived language found: {lang}"
        exit_codes:
          0: Başarılı
          1: Archive'da yok / zaten var / hata

      - name: purge
        desc: Archive ve kullanılmayan snapshotları temizle
        usage: bp purge [--archive-only] [--snapshots-only] [--pretend|--dry-run]
        flags:
          - name: --archive-only
            desc: Sadece archive klasörünü temizle
          - name: --snapshots-only
            desc: Sadece kullanılmayan snapshotları temizle
          - name: --pretend, --dry-run
            desc: Silmeden ne kadar yer açılacağını göster
        behavior: |
          Default (flagsız): archive + kullanılmayan snapshotlar silinir

          Archive temizleme:
          - .blueprint/archive/ tamamen silinir

          Snapshot temizleme:
          - Her paket için .blueprint/history/ taranır
          - "Kullanılmayan" snapshot tanımı (şimdilik basit):
            - current olmayan snapshotlar
            - NOT: Gelecekte dependent tracking ile aktif snapshot koruması eklenecek
          - Kullanılmayan snapshotlar silinir

          --pretend modu:
          - Hiçbir şey silinmez
          - Ne silinecek ve ne kadar yer açılacak gösterilir
        output:
          pretend: |
            Archive:
              src-py/     312 MB   (archived: 2026-01-27)
              src-rs/     287 MB   (archived: 2026-01-25)

            Unused snapshots:
              src-go/     156 MB   (8 snapshots, keeping 1 current)
              ./          89 MB    (5 snapshots, keeping 1 current)

            Total: 844 MB would be freed
          success: |
            Purged:
              Archive: 599 MB (2 languages)
              Snapshots: 245 MB (13 snapshots)
            Total freed: 844 MB
          nothing: "Nothing to purge"
        exit_codes:
          0: Başarılı (veya temizlenecek bir şey yok)
          1: Hata

  library:
    note: |
      Aşağıdaki tipler language-agnostic tanımlanmıştır.
      Implementasyon diline göre class, struct, record, interface vb. kullanılabilir.

    types:
      - name: Blueprint
        desc: Tek BLUEPRINT.yaml dosyasını temsil eder
        fields:
          - name: path
            type: string
            desc: BLUEPRINT.yaml dosyasının tam yolu
          - name: data
            type: map<string, any>
            desc: Parse edilmiş YAML içeriği
          - name: state_dir
            type: string
            desc: State klasörünün yolu (_meta.state_dir, default .blueprint)
          - name: mode
            type: string
            desc: Development mode (_meta.mode, default meek)
        methods:
          - name: validate
            returns: ValidationResult
            desc: YAML syntax + schema check
          - name: is_stale
            returns: bool?
            desc: Kod değişmiş mi? (null = snapshot yok)
          - name: api_hash
            returns: string
            desc: API section hash
          - name: spec_hash
            returns: string
            desc: Implementation section hash
          - name: get_changed_files
            returns: string[]
            desc: Değişen dosyaların listesi
          - name: get_section
            args: [section: string]
            returns: map<string, any>?
            desc: api, implementation, tests bölümünü al
          - name: get_history
            returns: HistoryEntry[]
            desc: Snapshot geçmişi
          - name: save_state
            returns: void
            desc: .blueprint/state.yaml güncelle

      - name: HistoryEntry
        desc: Tek bir snapshot kaydı
        fields:
          - name: id
            type: string
            desc: "Snapshot ID: {slug}-{hash4} veya ss-{hash8}, örn 'add-validate-a1b2'"
          - name: timestamp
            type: string
            desc: ISO 8601 format
          - name: message
            type: string
            desc: Snapshot mesajı
          - name: content_hash
            type: string
            desc: Tam content hash (referans için)
          - name: api_hash
            type: string
            desc: API section'ın hash'i
          - name: spec_hash
            type: string
            desc: Implementation section'ın hash'i
          - name: impl_hash
            type: string
            desc: Implementation dosyalarının birleşik hash'i
          - name: rotten
            type: bool
            desc: Snapshot rotten mı? (upgrade testleri fail ettiyse true)

      - name: PlanStep
        desc: Plan sırasındaki tek adım
        fields:
          - name: path
            type: string
            desc: Blueprint path (relative)
          - name: state
            type: string
            desc: "stale | no_snapshot"
          - name: reason
            type: string
            desc: "files_changed | blueprint_changed | deps_changed | deps_api_changed"

      - name: PlanResult
        desc: Plan komutu sonucu
        fields:
          - name: steps
            type: PlanStep[]
            desc: Leaf-first sıralı adımlar

      - name: DepState
        desc: Bir dependency'nin pin durumu (state.yaml deps içinde)
        fields:
          - name: pinned
            type: string
            desc: Pin'lenmiş snapshot ID
          - name: latest
            type: string
            desc: Dependency'nin en son snapshot ID'si
          - name: api_hash
            type: string
            desc: Pin'lenmiş versiyonun API hash'i
          - name: latest_api_hash
            type: string
            desc: En son versiyonun API hash'i
          - name: api_changed
            type: bool
            desc: API değişmiş mi? (convenience flag)
          - name: rotten
            type: bool
            desc: Latest snapshot rotten mı?

      - name: DepRef
        desc: Reverse dependency bilgisi (state.yaml dependents içinde)
        fields:
          - name: using
            type: string
            desc: Hangi snapshot'ımı kullanıyor

      - name: BlueprintTree
        desc: Klasör hiyerarşisindeki tüm blueprint'ler
        fields:
          - name: root
            type: string
            desc: Root klasör yolu
        methods:
          - name: walk
            returns: Blueprint[]
            desc: Tüm blueprint'leri listele (iterable)
          - name: resolve_deps
            args: [bp: Blueprint]
            returns: Blueprint[]
            desc: Bir blueprint'in dependency'lerini bul
          - name: topological_sort
            returns: Blueprint[]
            desc: Dependency sırasına göre sırala

      - name: ValidationResult
        desc: Validation sonucu
        fields:
          - name: valid
            type: bool
            desc: Geçerli mi?
          - name: errors
            type: string[]
            desc: Hata mesajları
          - name: warnings
            type: string[]
            desc: Uyarı mesajları

      - name: ArchiveMeta
        desc: Archive'lanmış dil kökü metadata'sı
        fields:
          - name: archived_at
            type: string
            desc: ISO 8601 timestamp
          - name: last_snapshot
            type: string
            desc: Archive öncesi son snapshot ID
          - name: reason
            type: string
