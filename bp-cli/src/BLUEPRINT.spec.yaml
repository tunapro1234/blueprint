# bp - Implementation & Test Specification

_meta:
  version: "0.2.0"
  type: spec  # Bu bir spec dosyası, ana blueprint değil

# =============================================================================
# IMPLEMENTATION
# =============================================================================

implementation:
  structure:
    - entry point       # CLI ana giriş noktası
    - core module       # Blueprint, BlueprintTree tipleri
    - state module      # State yönetimi (state_dir işlemleri)
    - yamlparser/:      # YAML parsing (./yamlparser modülü)
        has_blueprint: true
    - commands/:
        has_blueprint: true

  data_structures:
    blueprint_dir: |
      {state_dir}/                         # _meta.state_dir (default .blueprint)
      ├── current                           # Son snapshot ID
      ├── impl.lock                         # Aktif implementasyon kilidi
      ├── impl.hidden                       # Working tree gizli işareti
      ├── state.yaml                        # Files, deps, dependents
      └── history/
          ├── 20260116-1430-a1b2-add-feat/  # Snapshot ID (timestamp-hash-slug)
          │   ├── BLUEPRINT.yaml            # Blueprint snapshot
          │   ├── meta.yaml                 # id, timestamp, message, hashes
          │   └── impl/                     # TAM KOD KOPYASI (MVP)
          │       ├── main.go
          │       ├── util.go
          │       └── deps/                 # Dependency symlinks
          │           ├── yamlparser/ → ../../../../yamlparser/{state_dir}/history/{pinned_id}/impl/
          │           └── commands/ → ../../../../commands/{state_dir}/history/{pinned_id}/impl/
          └── 20260115-1000-c3d4-initial/
              ├── BLUEPRINT.yaml
              ├── meta.yaml
              └── impl/
                  └── ...

    meta_yaml: |
      # {state_dir}/history/{id}/meta.yaml
      id: "20260116-1430-a1b2-add-feat"   # Snapshot ID (timestamp-hash-slug)
      timestamp: "2026-01-16T14:30:00"    # ISO 8601 format
      message: "Add feature"              # User -m ile veya otomatik tarih
      content_hash: "sha256:full..."      # Tam content hash (referans için)
      api_hash: "sha256:abc123..."        # API section hash
      spec_hash: "sha256:def456..."       # Implementation section hash
      impl_hash: "sha256:xyz789..."       # Implementation dosyalarının birleşik hash'i
      rotten: false                       # true = dependent testleri fail etmiş

    state_yaml: |
      # {state_dir}/state.yaml
      # Dosya hash'leri, dependency state ve reverse tracking
      snapshot_id: "20260116-1430-a1b2-add-feat"  # Mevcut snapshot ID
      blueprint_hash: "sha256:abc123..."          # BLUEPRINT.yaml'ın hash'i
      impl_hash: "sha256:xyz789..."               # Tüm impl dosyalarının birleşik hash'i
      files:
        "main.go": "sha256:def456..."
        "util.go": "sha256:ghi789..."

      # Dependencies: hangi snapshot'lara pin'liyiz
      deps:
        "./yamlparser":
          pinned: "20260115-1200-c3d4-stable"     # Pin'lenmiş snapshot
          latest: "20260116-0900-e5f6-new-api"    # Dependency'nin en son snapshot'ı
          api_hash: "sha256:aaa111..."            # Pinned versiyonun API hash'i
          latest_api_hash: "sha256:bbb222..."     # Latest'in API hash'i
          api_changed: true                       # API değişmiş mi?
          rotten: false                           # Latest snapshot rotten mi?

      # Dependents: kim bize bağlı (reverse tracking)
      dependents:
        "../consumer":
          using: "20260116-1430-a1b2-add-feat"   # Hangi snapshot'ımızı kullanıyor
        "../other":
          using: "20260115-1000-x1y2-initial"    # Eski versiyon kullanıyor

    blueprint_template: |
      # {folder_name}

      _meta:
        version: "0.1.0"
        updated: {date}
        status: draft

      intent: TODO

      overview: |
        TODO

      api:
        exports: []

      implementation:
        structure: []

      tests:
        scenarios: []

# =============================================================================
# WORKFLOW POLICY
# =============================================================================

workflow_policy:
  summary: |
    Symlink tabanlı dependency yönetimi:
    - Paket klasörü edit alanıdır (working tree)
    - Her snapshot impl/ altında deps/ klasörü bulunur
    - deps/{dep_name}/ → dependency'nin pinned snapshot impl'ine symlink
    - Import/build için deps/ klasöründeki symlinkler kullanılır
    - bp upgrade symlink'leri günceller, kod değişikliği gerekmez

  algorithms:
    root_resolution: |
      Root blueprint bulma algoritması:
      1. Mevcut klasörden başla
      2. BLUEPRINT.yaml ara
      3. Varsa ve _meta.root: true ise → root bulundu
      4. Yoksa veya root değilse → parent klasöre çık
      5. Parent'ta BLUEPRINT.yaml varsa:
         a. _meta.root: true ise → root bulundu
         b. Değilse → topmost_blueprint olarak işaretle, parent'a devam
      6. Daha parent yoksa (/ veya repo root):
         a. topmost_blueprint varsa → onu root olarak kullan
         b. Yoksa → mevcut klasör root

      Komut davranışı:
      - bp <cmd>        → root bul, root'tan -r ile çalıştır
      - bp <cmd> .      → sadece bulunulan paket (explicit path)
      - bp <cmd> ./sub  → sadece ./sub paketi (explicit path)

      Örnek:
        /project/             (_meta.root: true)
        /project/src/         (normal paket)
        /project/src/parser/  (normal paket)

        /project/src/parser/ içinde "bp validate" çalıştırılırsa:
        1. parser/ → root değil
        2. src/ → root değil, topmost_blueprint = src/
        3. project/ → _meta.root: true → ROOT BULUNDU
        4. "bp validate -r /project/" çalışır

    staleness_check: |
      1. {state_dir}/state.yaml oku (yoksa → no_snapshot)
      2. Dosya kontrolü:
         - Her tracked_file için hash hesapla
         - State'teki hash ile karşılaştır
         - Farklıysa → stale (files_changed)
      3. Blueprint kontrolü:
         - BLUEPRINT.yaml hash hesapla
         - Farklıysa → stale (blueprint_changed)
      4. Dependency kontrolü (pinned/latest modeli):
         - state.yaml deps bölümündeki her dep için:
         - deps[dep].pinned != deps[dep].latest → stale (deps_changed)
         - deps[dep].api_changed == true → stale (deps_api_changed, daha kritik)
      5. Hiçbiri değişmediyse → fresh

      Stale reason'lar (standardize):
      - files_changed: Kendi dosyaları değişmiş
      - blueprint_changed: BLUEPRINT.yaml değişmiş
      - deps_changed: Dependency'nin yeni versiyonu var (pinned != latest)
      - deps_api_changed: Dependency'nin API'si değişmiş (api_changed == true)

      Notlar:
      - API/spec hash farkları staleness reason'a eklenmez; status flag'leriyle raporlanır.
      - impl.hidden varsa silinmiş dosyalar changed_files listesine eklenmez.
      - deps/ symlink değişimleri staleness hesabına girmez

      Öncelik: files_changed > blueprint_changed > deps_api_changed > deps_changed

    dependency_resolution: |
      1. Alt dizinleri tara
      2. BLUEPRINT.yaml varsa → implicit dependency
      3. Explicit dependencies varsa → parse et ve ekle:

         Format A - Basit liste:
         dependencies:
           - ../other
           - ../shared/utils

         Format B - Detaylı map:
         dependencies:
           internal:              # Aynı repo içi dependency'ler
             - path: ./yamlparser
               desc: YAML parser modülü
             - path: ./commands
           from_parent:           # Parent blueprint'ten gelen tipler
             - Blueprint
             - ValidationResult

         Parse kuralları:
         - Array ise → her item path olarak kullanılır
         - Map ise → internal listesindeki path'ler kullanılır
         - from_parent sadece tip referansı, path olarak eklenmez

      4. Recursive olarak alt dependency'leri de çöz

    topological_sort: |
      Kahn's algorithm:
      1. Dependency graph oluştur (adjacency list)
      2. Her node için in-degree hesapla
      3. In-degree 0 olanları queue'ya ekle
      4. Queue'dan al, result'a ekle
      5. Komşuların in-degree'sini azalt
      6. In-degree 0 olanları queue'ya ekle
      7. Result.length != node_count ise cycle var

    plan_order: |
      Plan sıralaması (leaf-first):
      1. BlueprintTree.Walk ile tüm blueprint'leri topla
      2. TopologicalSort ile dependency sırasını çıkar
      3. state "stale" veya "no_snapshot" olanları filtrele
      4. Kalanları aynı sırayla listede göster

    symlink_policy: |
      Symlink tabanlı import yönetimi:
      - Her snapshot impl/deps/ altında dependency symlink'leri tutar
      - bp upgrade çalıştırıldığında symlink hedefi güncellenir
      - Kod içinde değişiklik gerekmez, import'lar deps/{name} üzerinden yapılır
      - Collision durumunda 'as:' ile explicit alias tanımlanır

    rotten_warning: |
      Global rotten uyarı mekanizması:
      - Her bp komutu başında state.yaml deps kontrol edilir
      - Rotten dependency varsa stderr'e uyarı yazılır:
        "⚠ Rotten dependency: ./yamlparser (tests failed on upgrade)"
      - Komut normal çalışmaya devam eder
      - Rotten bir snapshot kullanılıyorsa işlevsellik etkilenmez
        ama kullanıcı uyarılır

    hash_calculation: |
      Dosya hash:
      1. Dosya içeriğini binary olarak oku
      2. SHA-256 hash hesapla
      3. Hex string'e çevir
      4. "sha256:" prefix ekle
      Örnek: "sha256:e3b0c44298fc1c149afbf4c..."

    impl_hash_calculation: |
      Implementation hash (tüm impl dosyalarının birleşik hash'i):
      1. implementation.structure'daki dosyaları topla
      2. Dosyaları alfabetik sırala
      3. Her dosya için: "{relative_path}:{file_hash}\n" string oluştur
      4. Tüm string'leri birleştir
      5. Birleşik string'in SHA-256 hash'ini al
      Örnek: "sha256:abc123..."

    snapshot_id_calculation: |
      Snapshot ID formatı: YYYYMMDD-HHMM-{4-char-hash}-{slug}

      1. Timestamp: time.Now().Format("20060102-1504")
         Örnek: "20260116-1430"

      2. Content hash hesapla:
         - Birleştir: "{blueprint_hash}:{impl_hash}:{deps_hash}"
         - SHA-256 hash al
         - Tam hash'i meta.yaml'a kaydet (content_hash)

      3. 4-char hash: content_hash'in ilk 4 karakteri
         Örnek: "a1b2"

      4. Slug: slugify(message)
         - Lowercase yap
         - Özel karakterleri kaldır (sadece a-z, 0-9, space)
         - Boşlukları "-" ile değiştir
         - Max 20 karakter
         Örnek: "Add validation logic" → "add-validation-logic"

      5. Birleştir: "{timestamp}-{4-char-hash}-{slug}"
         Örnek: "20260116-1430-a1b2-add-validation-logic"

      Avantajlar:
      - İnsan tarafından okunabilir (tarih + ne değişti)
      - Kronolojik sıralama doğal
      - Hash sayesinde collision yok
      - Aynı dakikada farklı içerik = farklı hash = farklı ID

    deps_hash_calculation: |
      Dependency hash:
      1. Dependency'leri alfabetik sırala
      2. Her dep için: "{dep_path}:{dep_snapshot_id}\n" string oluştur
      3. Birleştir ve SHA-256 hash al
      4. Dependency yoksa: empty string hash'i kullanılır

    api_hash_calculation: |
      API section hash (dependency tracking için):
      1. Blueprint'in api section'ını al
      2. JSON-like canonical format'a çevir (sorted keys)
      3. SHA-256 hash al

      Bu hash dependency'nin "public interface"ini temsil eder.
      api_hash değiştiyse → dependent paketler stale olur

    spec_hash_calculation: |
      Spec hash (implementation section):
      1. Blueprint'in implementation section'ını al
      2. JSON-like canonical format'a çevir (sorted keys)
      3. SHA-256 hash al

    unified_diff: |
      Standart unified diff formatı:
      - İlk satır: --- <old_file>
      - İkinci satır: +++ <new_file>
      - Hunk header: @@ -start,count +start,count @@
      - Silinen satırlar: - prefix
      - Eklenen satırlar: + prefix
      - Context satırları: space prefix

    implement_algorithm: |
      bp implement algoritması:
      0. Blueprint'i validate et (error varsa exit 2)
      1. impl.lock varsa hata ver (aktif implementasyon var)
      2. Blueprint'i yükle, dependencies bölümünü oku
      3. Dependency yoksa → "No dependencies, ready to implement"
      4. Her dependency için:
         a. Dependency path'ini resolve et (relative → absolute)
         b. Dependency'nin {state_dir}/state.yaml'ını kontrol et
         c. snapshot_id yoksa → hata: "Dependency {dep} has no snapshot"
         d. Dependency'nin state.yaml'ına reverse tracking ekle
         e. Kendi state.yaml deps section'ına pin ekle
      5. --clean yoksa kendi snapshot'ından impl restore et
      6. deps/ klasörü oluştur, her dependency için symlink:
         deps/{dep_name}/ → {dep_path}/{state_dir}/history/{pinned_id}/impl/
      7. impl.lock oluştur (aktif implementasyon)
      8. "Ready to implement" mesajı ver

      Implementation bitince: bp apply -m "message"

      İzolasyon garantisi:
      - Her paket kendi dependency'lerinin stable snapshot'ına referans veriyor
      - Dependency kodu: deps/ symlink'leri üzerinden erişilir
      - Ana klasör = development, history = stable versiyonlar

    upgrade_algorithm: |
      bp upgrade [dep-path] [--safe|--all|--force] algoritması:
      1. state.yaml deps bölümünü oku
      2. Her dependency için (veya sadece dep-path verilmişse o):
         a. Dependency'nin {state_dir}/current dosyasını oku → latest_id
         b. Dependency'nin history/{latest_id}/meta.yaml'dan api_hash ve rotten oku
         c. Rotten true ve --force yoksa → atla, uyarı ver
         d. Mevcut pinned api_hash ile karşılaştır
         e. API değişmişse ve --safe varsa → atla
      3. Upgrade yapılacaklar için:
         a. Eski pinned_id'yi sakla (rollback için)
         b. deps/ symlink'ini güncelle (working tree aktifse)
         c. tests.verification çalıştır
         d. Test başarısız olursa:
            - Symlink'i eski haline döndür (rollback)
            - Dependency'nin meta.yaml'ına rotten: true yaz
            - state.yaml deps'e rotten: true ekle
            - Uyarı ver, devam et
         e. Test başarılı olursa:
            - state.yaml deps'i güncelle (pinned, api_hash, rotten: false)
            - Dependency'nin dependents section'ını güncelle
      4. Özet: upgraded, skipped (rotten), failed (test)

    impl_copy_algorithm: |
      bp apply impl/ kopyalama algoritması:
      1. Hangi dosyalar kopyalanacak:
         - implementation.structure'dan dosya listesi al
         - Yoksa: dizindeki kaynak dosyalarını tara (.go, .py, etc.)
      2. Hariç tutulanlar:
         - {state_dir}/
         - .git/
         - *_test.go (test dosyaları - opsiyonel)
         - node_modules/, __pycache__/, etc.
         - deps/ (symlink klasörü kopyalanmaz, yeniden oluşturulur)
      3. Kopyalama:
         - {state_dir}/history/{id}/impl/ klasörü oluştur
         - Her dosyayı relatif path'i koruyarak kopyala
         - Dizin yapısını oluştur (mkdir -p equivalent)
      4. Symlink oluşturma:
         - impl/deps/ klasörü oluştur
         - state.yaml'dan dependency pin'lerini oku
         - Her dependency için symlink:
           deps/{dep_name}/ → {dep_path}/{state_dir}/history/{pinned_id}/impl/
         - Collision varsa 'as:' alias'ını kullan
      5. Kopyalanan dosyaları read-only yap (write bitlerini kaldır, exec bitlerini koru)
      6. Snapshot başarılı olursa working tree implementation dosyalarını temizle
      7. Sonuç: Tam, standalone kod kopyası + dependency symlink'leri

  decisions:
    - q: Paketler arası iletişim nasıl?
      a: |
        api.type ile belirtilir, serbest string.
        Belirtilmezse "library" (kod içi import) kabul edilir.

        Örnekler: library, http, cli, grpc, ros, mqtt, websocket...
        Kısıtlama yok, proje ihtiyacına göre belirlenir.

    - q: Neden tek BLUEPRINT.yaml?
      a: |
        Varsayılan olarak tek dosya, bölümler içinde ayrılmış.

        Büyük blueprint'ler için bölümler ayrı dosyalara taşınabilir:

        ```yaml
        # Ayrı dosyalar:
        implementation: "./BLUEPRINT.impl.yaml"
        tests: "./BLUEPRINT.tests.yaml"

        # Veya tek birleşik dosya (önerilen):
        implementation: "./BLUEPRINT.spec.yaml"
        tests: "./BLUEPRINT.spec.yaml"

        # Anchor syntax ile spesifik section:
        implementation: "./BLUEPRINT.spec.yaml#implementation"
        tests: "./BLUEPRINT.spec.yaml#tests"
        ```

        String değer verilirse o path'ten yüklenir (relative to BLUEPRINT.yaml).
        Object verilirse inline kullanılır (mevcut davranış).

    - q: Section referans syntax'ı nasıl çalışır?
      a: |
        İki format desteklenir:

        1. Sadece path: "./BLUEPRINT.spec.yaml"
           - Dosya yüklenir
           - İlgili section key'i aranır (implementation veya tests)
           - Bulunamazsa tüm dosya içeriği kullanılır

        2. Anchor syntax: "./BLUEPRINT.spec.yaml#implementation"
           - Dosya yüklenir
           - # sonrası key ile section seçilir
           - Key bulunamazsa hata

    - q: Hangi dosyalar blueprint dosyası olarak tanınır?
      a: |
        bp tool şu pattern'lere uyan dosyaları tarar:

        Pattern'ler (hepsi eşdeğer, kullanıcı seçer):
        - BLUEPRINT.yaml, .BLUEPRINT.yaml (default, büyük harfli)
        - BLUEPRINT.*.yaml, .BLUEPRINT.*.yaml
        - *.BP.yaml, .*.BP.yaml

        Küçük harfli alternatifler de desteklenir:
        - blueprint.yaml, .blueprint.yaml
        - blueprint.*.yaml, .blueprint.*.yaml
        - *.bp.yaml, .*.bp.yaml

        Bir klasörde tek ana blueprint olmalı. Birden fazla varsa warning.

    - q: state_dir/ ne işe yarar?
      a: |
        Internal state. Son snapshot, file hash'leri.
        _meta.state_dir ile ayarlanır (default .blueprint). Kullanıcı dokunmaz.

    - q: Dependency nasıl belirlenir?
      a: |
        İki tür dependency var:

        1. Implicit (alt klasörler):
           - Alt klasörde BLUEPRINT.yaml varsa otomatik dependency
           - Listelemeye gerek yok

        2. Explicit (dependencies bölümü):
           İki format desteklenir:

           a) Basit liste (sadece path):
              dependencies:
                - ../other
                - ../shared/utils

           b) Detaylı map (path + açıklama):
              dependencies:
                internal:
                  - path: ./yamlparser
                    desc: YAML parser modülü
                  - path: ./commands
                    desc: CLI komutları
                from_parent:
                  - Blueprint    # Parent'tan gelen tip referansları

           "internal" key'i aynı repo içi dependency'ler için kullanılır.
           "from_parent" key'i parent blueprint'ten inherit edilen tipler için.

        Path kuralları:
        - Relative path'ler BLUEPRINT.yaml'a göre resolve edilir
        - Path normalize edilir (// → /, /./ → /)
        - ".." ile üst klasörlere çıkılabilir
        - Absolute path desteklenmez (hata verir)

        Hata politikası:
        - Path mevcut değil → warning, atlanır
        - Path'te BLUEPRINT.yaml yok → warning, atlanır
        - Absolute path → error
        - Cycle → error

    - q: has_blueprint nasıl kullanılır?
      a: |
        implementation.structure'da klasör için:

        implementation:
          structure:
            - src/main             # Dosya (track edilir)
            - src/core
            - commands/:           # Klasör, kendi blueprint'i var
                has_blueprint: true
            - build/:              # Klasör, blueprint yok
                has_blueprint: false

        has_blueprint: true → dependency olarak taranır, dosyaları track edilmez
        has_blueprint: false → tamamen atlanır
        has_blueprint belirtilmezse: klasörde BLUEPRINT.yaml varsa true, yoksa false

    - q: Git gerekli mi?
      a: Hayır. Tamamen dosya sistemi bazlı. Hash'ler ile tracking.

    - q: External dependency var mı?
      a: |
        Hayır. Kendi YAML parser'ımızı kullanıyoruz (yamlparser/).
        Standart YAML library kullanmıyoruz çünkü blueprint dosyalarında
        type annotation, signature gibi değerler var ve bunlar standart
        YAML syntax'ı ile çakışıyor.

        Parser destekledikleri:
        - Scalar: string, int, float, bool (true/false/yes/no), null
        - List: "- item" formatı (nested dahil)
        - Dict: "key: value" formatı (nested dahil)
        - Multi-line: | (literal), > (folded)
        - Yorumlar: # (satır sonu dahil)
        - Type annotations: map<string, any>, string[], Type?
        - Signatures: (arg: Type) -> Result

        Desteklenmeyen:
        - Inline: [a, b], {a: b} - bunlar scalar olarak parse edilir
        - Anchor/alias: &ref, *ref
        - Tag: !tag

    - q: Hangi alanlar zorunlu?
      a: |
        Zorunlu (error):
        - _meta.version: Semantic version string

        Önerilen (warning):
        - intent: Paketin amacı

        Opsiyonel:
        - _meta.updated, _meta.status
        - overview, api, implementation, tests, dependencies

        Bilinmeyen alanlar: Sessizce ignore edilir (flexible schema)

    - q: Hangi dosyalar track edilir?
      a: |
        implementation.structure'da listelenen:
        - Dosyalar: Hash hesaplanır, state.yaml'a kaydedilir
        - Klasörler (has_blueprint: false): İçindeki dosyalar recursive track edilir
        - Klasörler (has_blueprint: true): Track edilmez, kendi state'leri var

        Symlink: Takip edilir ama cycle kontrolü yapılır
        Not: deps/ symlink klasörü hash/staleness takibine dahil edilmez

    - q: tests.verification nasıl çalışır?
      a: |
        Blueprint'te tanımlanan verification komutları:

        tests:
          verification:
            - "test command 1"
            - "test command 2"

        bp apply davranışı:
        - Ön koşul: impl.lock var (bp impl çalıştırılmış olmalı)
        - Her komutu sırayla shell'de çalıştırır
        - Working directory: BLUEPRINT.yaml'ın bulunduğu klasör
        - Timeout: 5 dakika per komut
        - Herhangi biri exit code != 0 dönerse başarısız
        - verification boş veya yoksa: testler başarılı kabul edilir

    - q: Snapshot ID kuralları nedir?
      a: |
        Format: YYYYMMDD-HHMM-{4-char-hash}-{slug}
        Örnek: "20260116-1430-a1b2-add-validation"

        Bileşenler:
        - YYYYMMDD-HHMM: Timestamp (sıralama için)
        - 4-char-hash: Content hash'in ilk 4 karakteri (uniqueness)
        - slug: Message'dan türetilen slug (max 20 char, okunabilirlik)

        Hash hesaplama:
        - blueprint_hash + impl_hash + deps_hash birleştirilir
        - SHA-256 hash alınır
        - Tam hash meta.yaml'a kaydedilir (content_hash)
        - İlk 4 karakter ID'ye eklenir

        Avantajlar:
        - İnsan tarafından okunabilir
        - Kronolojik sıralama doğal
        - Hash sayesinde collision yok
        - Ne değiştiği görünür

        Bozuk history davranışı:
        - meta.yaml eksik/bozuk → o snapshot atlanır, warning
        - BLUEPRINT.yaml eksik → o snapshot atlanır, warning
        - impl/ eksik → warning (gelecekte delta'dan reconstruct)
        - Klasör adı geçersiz format → atlanır

    - q: Snapshot eşzamanlılığı nasıl yönetilir?
      a: |
        Lock mekanizması yok (basitlik için).

        Yeni ID formatı (YYYYMMDD-HHMM-{hash}-{slug}) ile çakışma nadir:
        - Aynı dakikada aynı içerik = aynı hash = aynı ID (idempotent)
        - Aynı dakikada farklı içerik = farklı hash = farklı ID

        Klasör zaten varsa:
        - Content hash karşılaştırılır
        - Aynıysa: "Snapshot already exists", exit 0 (idempotent)
        - Farklıysa: Çok nadir edge case, hata verilir

    - q: Terminoloji standardı nedir?
      a: |
        Durum isimleri:
        - fresh: Kod snapshot ile aynı
        - stale: Kod değişmiş
        - no_snapshot: Henüz snapshot alınmamış ({state_dir}/ yok)

  edge_cases:
    - case: Birden fazla ana blueprint
      handle: Warning ver, ilk bulunanı kullan (alfabetik sıra)

    - case: YAML parse hatası
      handle: '"YAML parse error at line {n}: {message}" formatında hata'

    - case: Circular dependency
      handle: '"Circular dependency detected: a → b → c → a" formatında hata'

    - case: {state_dir}/ yok
      handle: İlk bp apply'de oluştur

    - case: BLUEPRINT.yaml yok
      handle: '"Not a blueprint package" olarak atla'

    - case: Symlink cycle
      handle: Visited set ile tespit, hata ver

    - case: Permission denied
      handle: Açıklayıcı hata mesajı, hangi dosya olduğunu belirt

    - case: Snapshot ID collision
      handle: |
        Content hash aynıysa zaten aynı snapshot.
        Klasör varsa yeni snapshot oluşturulmaz, mevcut ID döner.
        (Idempotent davranış)

    - case: Dependency snapshot yok
      handle: |
        Dependency'nin {state_dir}/current dosyası yoksa:
        - Warning ver: "Dependency {path} has no snapshot"
        - deps_hash hesaplamasında bu dep atlanır
        - Snapshot yine alınabilir (soft dependency)

    - case: Section referans bulunamadı
      handle: '"Section #xyz not found in file" hatası'

# =============================================================================
# TESTS
# =============================================================================

tests:
  packages:
    - "./..."
  dependency_snapshots: true
  snapshot_readonly: true
  scenarios:
    # =========================================================================
    # CLI TESTS
    # =========================================================================

    # Validate
    - id: cli_validate_valid
      given: Geçerli BLUEPRINT.yaml
      when: bp validate
      then: exit 0, "✓" gösterir

    - id: cli_validate_invalid_yaml
      given: Bozuk YAML (indent hatası)
      when: bp validate
      then: exit 1, satır numarası ile hata

    - id: cli_validate_missing_intent
      given: intent alanı yok
      when: bp validate
      then: exit 2, warning (error değil)

    - id: cli_validate_recursive
      given: 3 alt klasör, 1'i invalid
      when: bp validate -r
      then: Hepsi listelenir, exit 1

    # Status
    - id: cli_status_fresh
      given: Kod hiç değişmemiş
      when: bp status
      then: exit 0, "✓ . (fresh)"

    - id: cli_status_stale
      given: Bir dosya değişmiş
      when: bp status
      then: exit 1, "⚠ . (stale, 1 files changed)"

    - id: cli_status_no_snapshot
      given: {state_dir}/ yok
      when: bp status
      then: exit 2, "○ . (no snapshot)"

    # Deps
    - id: cli_deps_no_deps
      given: Alt klasör yok
      when: bp deps
      then: Sadece kendisi listelenir

    - id: cli_deps_nested
      given: a/ → b/ → c/ hiyerarşisi
      when: bp deps a/
      then: '"c, b, a" sırasında'

    - id: cli_deps_circular
      given: a → b, b → a
      when: bp deps
      then: Hata mesajı

    # Init
    - id: cli_init_empty
      given: Boş klasör
      when: bp init
      then: BLUEPRINT.yaml oluşur

    - id: cli_init_existing
      given: BLUEPRINT.yaml zaten var
      when: bp init
      then: Hata, üzerine yazmaz

    # =========================================================================
    # BLUEPRINT TYPE TESTS
    # =========================================================================

    - id: blueprint_load_valid
      given: Geçerli BLUEPRINT.yaml dosyası
      when: Blueprint oluşturulur
      then: data parse edilmiş, path doğru set edilmiş

    - id: blueprint_load_not_found
      given: Dosya yok
      when: Blueprint oluşturulur
      then: File not found hatası

    - id: blueprint_load_invalid_yaml
      given: Bozuk YAML syntax
      when: Blueprint oluşturulur
      then: Parse hatası (satır numarası ile)

    - id: blueprint_validate_valid
      given: Geçerli blueprint (_meta.version ve intent var)
      when: validate() çağrılır
      then: valid=true, errors=[], warnings=[]

    - id: blueprint_validate_missing_version
      given: _meta.version yok
      when: validate() çağrılır
      then: valid=false, errors=["missing _meta.version"]

    - id: blueprint_validate_missing_intent
      given: intent yok
      when: validate() çağrılır
      then: valid=true, warnings=["missing intent"]

    - id: blueprint_is_stale_fresh
      given: state.yaml var, dosyalar değişmemiş
      when: is_stale() çağrılır
      then: false

    - id: blueprint_is_stale_changed
      given: state.yaml var, bir dosya değişmiş
      when: is_stale() çağrılır
      then: true

    - id: blueprint_is_stale_no_snapshot
      given: {state_dir}/state.yaml yok
      when: is_stale() çağrılır
      then: null (snapshot yok)

    - id: blueprint_get_section_exists
      given: api bölümü var
      when: get_section("api") çağrılır
      then: api map döner

    - id: blueprint_get_section_not_exists
      given: tests bölümü yok
      when: get_section("tests") çağrılır
      then: null

    - id: blueprint_get_changed_files_none
      given: state.yaml var, dosyalar değişmemiş
      when: get_changed_files() çağrılır
      then: boş array

    - id: blueprint_get_changed_files_some
      given: state.yaml var, 2 dosya değişmiş
      when: get_changed_files() çağrılır
      then: 2 elemanlı array

    - id: blueprint_get_history_empty
      given: {state_dir}/history/ yok
      when: get_history() çağrılır
      then: boş array

    - id: blueprint_get_history_some
      given: 3 snapshot var
      when: get_history() çağrılır
      then: 3 elemanlı array (yeniden eskiye)

    # =========================================================================
    # BLUEPRINTTREE TYPE TESTS
    # =========================================================================

    - id: tree_walk_single
      given: Tek blueprint, alt klasör yok
      when: walk() çağrılır
      then: 1 Blueprint döner

    - id: tree_walk_nested
      given: root/ + root/sub1/ + root/sub2/
      when: walk() çağrılır
      then: 3 Blueprint döner

    - id: tree_walk_skip_no_blueprint
      given: root/ + root/sub/ (sub'da BLUEPRINT.yaml yok)
      when: walk() çağrılır
      then: Sadece root döner

    - id: tree_resolve_deps_implicit
      given: root/sub/ alt klasör (blueprint var)
      when: resolve_deps(root_bp) çağrılır
      then: sub_bp döner

    - id: tree_resolve_deps_explicit
      given: 'dependencies: [../other] tanımlı'
      when: resolve_deps(bp) çağrılır
      then: other_bp listede

    - id: tree_topological_sort_simple
      given: a → b → c (a en üst)
      when: topological_sort() çağrılır
      then: '[c, b, a] sırasında'

    - id: tree_topological_sort_circular
      given: a → b → c → a
      when: topological_sort() çağrılır
      then: Circular dependency hatası

    # =========================================================================
    # STATE MANAGEMENT TESTS
    # =========================================================================

    - id: state_yaml_write
      given: Blueprint ve dosyalar
      when: save_state() çağrılır
      then: state.yaml oluşur, hash'ler doğru

    - id: state_hash_consistency
      given: Aynı içerik
      when: İki kez hash hesaplanır
      then: Aynı sonuç

    - id: state_hash_utf8
      given: Unicode içerikli dosya
      when: Hash hesaplanır
      then: UTF-8 encode ile tutarlı hash

    # =========================================================================
    # SNAPSHOT TESTS
    # =========================================================================

    - id: apply_create_first
      given: {state_dir}/history/ yok, impl.lock var
      when: bp apply -m "initial"
      then: |
        - history/20260116-HHMM-xxxx-initial/ oluşur
        - BLUEPRINT.yaml kopyalanır
        - meta.yaml oluşturulur
        - impl/ klasörüne kod kopyalanır

    - id: apply_id_format
      given: Herhangi bir blueprint, impl.lock var
      when: bp apply -m "add feature"
      then: |
        - ID formatı: YYYYMMDD-HHMM-{4-char-hash}-{slug}
        - Örnek: 20260116-1430-a1b2-add-feature

    - id: apply_copies_impl
      given: Kaynak dosyalar var (main.go, util.go), impl.lock var
      when: bp apply -m "snapshot"
      then: |
        - {state_dir}/history/{id}/impl/ oluşur
        - main.go, util.go kopyalanır
        - Dizin yapısı korunur

    - id: apply_different_content_different_id
      given: Blueprint veya impl değişmiş, impl.lock var
      when: bp apply -m "change"
      then: Farklı ID ile yeni snapshot (4-char hash farklı)

    - id: apply_tests_fail
      given: tests.verification başarısız, impl.lock var
      when: bp apply
      then: Snapshot alınmaz, exit 1

    - id: apply_skip_tests
      given: tests.verification başarısız, impl.lock var
      when: bp apply --skip-tests
      then: Snapshot alınır

    - id: apply_records_dep_state
      given: Dependency'ler var ve snapshot'ları var, impl.lock var
      when: bp apply
      then: |
        - state.yaml'da deps section'ı dolu
        - Her dep için: pinned, latest, api_hash, latest_api_hash

    - id: apply_dep_no_snapshot_warning
      given: Dependency'nin snapshot'ı yok, impl.lock var
      when: bp apply
      then: Warning verilir, snapshot yine alınır

    # =========================================================================
    # DEPENDENCY TRACKING TESTS
    # =========================================================================

    - id: status_deps_changed
      given: Dependency'nin snapshot'ı değişmiş
      when: bp status
      then: stale, "deps changed" mesajı

    - id: status_deps_api_changed
      given: Dependency'nin api section'ı değişmiş
      when: bp status
      then: stale, "deps api changed" mesajı (daha kritik)

    - id: status_deps_fresh
      given: Dependency'ler değişmemiş
      when: bp status
      then: fresh (dependency kontrolü geçti)

    - id: impl_hash_same_content
      given: Aynı impl dosyaları
      when: İki farklı pakette impl_hash hesaplanır
      then: Aynı impl_hash (karşılaştırılabilir)

    # =========================================================================
    # IMPLEMENT & UPGRADE TESTS
    # =========================================================================

    - id: implement_no_deps
      given: Dependencies bölümü yok
      when: bp implement
      then: exit 0, "No dependencies, ready to implement"

    - id: implement_deps_ok
      given: Dependencies var, hepsinin snapshot'ı var
      when: bp implement
      then: |
        - exit 0, "Ready to implement"
        - Her dep'in state.yaml dependents'ına eklenir
        - Kendi state.yaml deps'ine pin eklenir

    - id: implement_dep_no_snapshot
      given: Dependency var ama snapshot'ı yok
      when: bp implement
      then: exit 1, "Dependency {dep} has no snapshot"

    - id: implement_reverse_tracking
      given: A, B'ye bağlı; B'nin snapshot'ı var
      when: A'da bp implement çalışır
      then: |
        - B'nin state.yaml dependents section'ına A eklenir
        - A'nın state.yaml deps section'ına B eklenir

    - id: upgrade_single_dep
      given: Dependency'nin yeni snapshot'ı var
      when: bp upgrade ./dep
      then: |
        - state.yaml deps güncellenir (pinned → latest)
        - Dependency'nin dependents section'ı güncellenir

    - id: upgrade_api_changed_warning
      given: Dependency API'si değişmiş
      when: bp upgrade ./dep
      then: |
        Upgraded ./dep: {pinned} → {latest} (API CHANGED!)
          Review: bp diff ./dep {pinned} {latest}
        exit 0 (uyarı verilir ama bloklanmaz)

    - id: upgrade_safe_skips_api_changed
      given: Dependency API'si değişmiş
      when: bp upgrade --safe
      then: O dependency atlanır, diğerleri upgrade edilir

    - id: upgrade_all
      given: Birden fazla dependency, bazıları güncel değil
      when: bp upgrade --all
      then: Tüm dependency'ler upgrade edilir (API warning'leri ile)

    - id: status_shows_dependents
      given: Başka paketler bu pakete bağlı
      when: bp status
      then: |
        - "Dependents:" section'ı gösterilir
        - Her dependent için hangi versiyon kullandığı gösterilir

    - id: status_shows_dep_upgrade
      given: Dependency'nin yeni versiyonu var
      when: bp status
      then: "⚠ ./dep: {pinned} → {latest}" mesajı gösterilir

    # =========================================================================
    # YAML PARSER TESTS
    # =========================================================================

    - id: yaml_parse_scalar_string
      given: "key: value"
      then: {key: "value"}

    - id: yaml_parse_scalar_int
      given: "count: 42"
      then: {count: 42}

    - id: yaml_parse_scalar_bool
      given: "enabled: true"
      then: {enabled: true}

    - id: yaml_parse_list
      given: |
        items:
          - a
          - b
      then: {items: ["a", "b"]}

    - id: yaml_parse_nested
      given: |
        parent:
          child: 1
      then: {parent: {child: 1}}

    - id: yaml_parse_multiline
      given: |
        text: |
          line1
          line2
      then: {text: "line1\nline2\n"}

    # =========================================================================
    # SECTION REFERENCE TESTS
    # =========================================================================

    - id: section_ref_simple_path
      given: 'implementation: "./spec.yaml"'
      when: spec.yaml'da implementation key'i var
      then: implementation section yüklenir

    - id: section_ref_anchor_syntax
      given: 'implementation: "./spec.yaml#implementation"'
      when: spec.yaml yüklenir
      then: implementation section'ı alınır

    - id: section_ref_not_found
      given: 'implementation: "./spec.yaml#nonexistent"'
      when: Key bulunamazsa
      then: Hata

    # =========================================================================
    # EDGE CASE TESTS
    # =========================================================================

    - id: edge_empty_blueprint
      given: Boş BLUEPRINT.yaml dosyası
      when: Blueprint oluşturulur
      then: Parse hatası veya boş map

    - id: edge_unicode_content
      given: Unicode içerikli blueprint
      when: Parse ve hash
      then: Sorunsuz çalışır

    - id: edge_deep_nesting
      given: 10 seviye klasör hiyerarşisi
      when: walk() çağrılır
      then: Tüm blueprint'ler bulunur

    - id: edge_symlink
      given: Symlink olan klasör
      when: walk() çağrılır
      then: Sonsuz döngüye girmez

  verification:
    - go test $(go list ./... | grep -v '/blueprint/')
    - ../bp validate -r || [ $? -eq 2 ]
