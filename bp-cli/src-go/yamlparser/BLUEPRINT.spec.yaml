# =============================================================================
# YAML PARSER - Implementation & Tests Specification
# =============================================================================

_meta:
  version: "0.1.0"
  type: spec

# =============================================================================
# WORKFLOW POLICY
# =============================================================================

workflow_policy:
  summary: |
    Bu tool enforce etmez; ekip standardı olarak:
    - Paket klasörü edit alanıdır (working tree)
    - Import/build için pinned snapshot kopyaları tercih edilir
      (örn. {state_dir}/history/{snapshot_id}/impl)
    - Snapshot'lar publish edilen stable sürümü temsil eder
    Not: {state_dir} = _meta.state_dir (default .bp)

# =============================================================================
# IMPLEMENTATION
# =============================================================================

implementation:
  structure:
    - parser module          # Ana parse fonksiyonları (parse, parse_file)
    - tokenizer module       # Satır tokenization
    - builder module         # Token'lardan structure oluşturma

  algorithms:
    tokenize_line: |
      Input: line string, line_number int
      Output: Token

      1. Leading whitespace'i say → indent_level
      2. Whitespace'i strip et → content
      3. Empty veya # ile başlıyorsa → Empty/Comment token
      4. "-" ile başlıyorsa → ListItem token, value'yu parse et
      5. ":" içeriyorsa → KeyValue token
         - İLK ":" ı bul (quote'lar içindeki ":" sayılmaz)
         - Öncesi key, sonrası value
      6. Hiçbiri değilse → Continuation token (önceki satırın devamı)

    find_first_colon: |
      Key-value ayırıcı olan ilk ":" ı bul.

      1. Karakterleri iterate et
      2. Quote içindeysen (" veya ') skip et
      3. Quote dışında ":" görünce pozisyonu dön
      4. Bulamazsan -1 dön (pure scalar value)

    build_structure: |
      Token listesinden nested structure oluştur.

      1. Root = empty map
      2. Stack = [(0, root)]  # (indent, node) pairs
      3. Her token için:
         a. Token indent'i stack top'dan küçükse: pop until match
         b. KeyValue: current node'a ekle, value block ise stack'e push
         c. ListItem: current node list değilse list yap, item ekle
         d. Continuation: önceki value'ya append et
      4. Root'u dön

  decisions:
    - q: Neden standart YAML kullanmıyoruz?
      a: |
        Blueprint dosyalarında type annotation, signature gibi değerler var.
        Bunlar ":", ",", "<>", "[]" içeriyor ve standart YAML bunları
        özel syntax olarak yorumluyor. Kendi parser'ımız daha toleranslı.

    - q: Tab vs space nasıl handle ediliyor?
      a: |
        Tab karakterleri 2 space'e çevrilir ve warning verilir.
        Tutarlılık için sadece space kullanımı önerilir.

    - q: Duplicate key olursa ne olur?
      a: |
        Son değer kullanılır.
        Warning verilir, çünkü genelde istenmeyen bir durum.

# =============================================================================
# TESTS
# =============================================================================

tests:
  packages:
    - "."
  snapshot_readonly: true
  scenarios:
    # =========================================================================
    # BASIC PARSING
    # =========================================================================

    - id: parse_simple_map
      given: |
        name: Test
        version: 1.0
      when: parse(content)
      then: 'data = {name: "Test", version: "1.0"}'

    - id: parse_nested_map
      given: |
        api:
          name: Test
          version: 1.0
      when: parse(content)
      then: |
        data = {api: {name: "Test", version: "1.0"}}

    - id: parse_list
      given: |
        items:
          - one
          - two
          - three
      when: parse(content)
      then: |
        data = {items: ["one", "two", "three"]}

    - id: parse_mixed
      given: |
        name: Test
        items:
          - first
          - second
        config:
          enabled: true
      when: parse(content)
      then: Nested map + list doğru parse edilir

    # =========================================================================
    # SPECIAL VALUES (BLUEPRINT-SPECIFIC)
    # =========================================================================

    - id: parse_type_annotation
      given: |
        field: map<string, any>
      when: parse(content)
      then: 'data = {field: "map<string, any>"}'

    - id: parse_signature
      given: |
        signature: "(ctx: Context) -> Result"
      when: parse(content)
      then: |
        data = {signature: "(ctx: Context) -> Result"}

    - id: parse_nullable_type
      given: |
        type: string?
      when: parse(content)
      then: |
        data = {type: "string?"}

    - id: parse_array_type
      given: |
        type: string[]
      when: parse(content)
      then: |
        data = {type: "string[]"}

    - id: parse_complex_inline
      given: |
        fields:
          - name: data
            type: map<string, any>
          - name: errors
            type: string[]
      when: parse(content)
      then: Her field doğru parse edilir, type değerleri korunur

    # =========================================================================
    # MULTILINE STRINGS
    # =========================================================================

    - id: parse_multiline_literal
      given: |
        desc: |
          Line one
          Line two
          Line three
      when: parse(content)
      then: |
        data.desc = "Line one\nLine two\nLine three\n"

    - id: parse_multiline_folded
      given: |
        desc: >
          This is a long
          description that
          wraps.
      when: parse(content)
      then: |
        data.desc = "This is a long description that wraps.\n"

    # =========================================================================
    # EDGE CASES
    # =========================================================================

    - id: parse_empty_value
      given: |
        key:
      when: parse(content)
      then: |
        data = {key: null}

    - id: parse_quoted_colon
      given: |
        desc: "Value with: colon inside"
      when: parse(content)
      then: |
        data = {desc: "Value with: colon inside"}

    - id: parse_comment
      given: |
        name: Test  # inline comment
        # full line comment
        version: 1.0
      when: parse(content)
      then: |
        data = {name: "Test", version: "1.0"}
        # Yorumlar ignore edilir

    - id: parse_duplicate_key
      given: |
        name: First
        name: Second
      when: parse(content)
      then: |
        data = {name: "Second"}
        warnings contains "Duplicate key"

    - id: parse_tabs
      given: (tab ile indent edilmiş content)
      when: parse(content)
      then: |
        Parse başarılı
        warnings contains "Tab characters"

    # =========================================================================
    # ERROR CASES
    # =========================================================================

    - id: parse_invalid_indent
      given: |
        root:
            child:     # 4 space
          sibling:     # 2 space (invalid - parent'tan az olamaz burada)
      when: parse(content)
      then: |
        error != null
        error.line = 3

    - id: parse_unclosed_quote
      given: |
        name: "unclosed string
      when: parse(content)
      then: |
        error != null
        error.message contains "unclosed"

  verification:
    - go test $(go list ./... | grep -v '/blueprint/')
    - ../../bp validate . || [ $? -eq 2 ]
