# bp - Blueprint Management Tool

_meta:
  version: "0.2.0"
  updated: 2026-01-19
  status: draft
  state_dir: "blueprint"
  root: true  # Bu proje root'u - alt paketlerde argümansız komutlar buradan çalışır

# =============================================================================
# PROJECT INFO
# =============================================================================

project:
  name: bp
  tagline: File-system based blueprint authoring and tracking tool
  description: |
    AI destekli yazılım geliştirme için tasarlanmış, BLUEPRINT.yaml dosyalarını
    yöneten, versiyonlayan ve takip eden CLI aracı.

license:
  type: GPL-3.0-or-later
  file: LICENSE
  notice: |
    This program is free software: you can redistribute it and/or modify
    it under the terms of the GNU General Public License as published by
    the Free Software Foundation, either version 3 of the License, or
    (at your option) any later version.

repository:
  url: https://github.com/tunapro1234/blueprint
  issues: https://github.com/tunapro1234/blueprint/issues
  discussions: https://github.com/tunapro1234/blueprint/discussions

author:
  name: Tuna Gül
  github: tunapro1234

# =============================================================================
# INTENT & OVERVIEW
# =============================================================================

intent: |
  Blueprint dosyalarını yöneten, versiyonlayan ve takip eden CLI tool.
  Kod ile dökümentasyon arasındaki tutarlılığı sağlar.

overview: |
  bp, yazılım projelerinde YAML formatında blueprint dosyaları kullanarak
  kod organizasyonunu ve versiyonlamayı yönetir.

  Temel özellikler:
  - Blueprint validation ve schema kontrolü
  - Hash-based snapshot sistemi (YYYYMMDD-HHMM-hash-slug formatında)
  - Dependency tracking ve reverse tracking
  - Dependency pinning ve upgrade yönetimi

# =============================================================================
# PLAN
# =============================================================================

plan:
  - id: state_dir_config
    status: done
    desc: _meta.state_dir ile state dizini ayarlanabilir; bu repo "blueprint" kullanır.
  - id: snapshot_imports
    status: done
    desc: Paketler snapshot impl dizinlerinden import edilecek şekilde güncellendi.
  - id: docs_update
    status: done
    desc: README ve blueprint/spec dokümanları state_dir için güncellendi.
  - id: tests_exclude_state_dir
    status: done
    desc: Verification komutları state dizinini test kapsamı dışında bırakır.
  - id: gitignore_state_dir
    status: done
    desc: state dizinini (blueprint/) gitignore'a ekle.

# =============================================================================
# WORKFLOW POLICY
# =============================================================================

dependency_policy:
  summary: |
    Symlink tabanlı dependency yönetimi:
    - Working tree (paket klasörü) sadece edit alanıdır
    - Her snapshot impl/ klasörü altında deps/ klasörü bulunur
    - deps/{dep_name}/ → dependency'nin pinned snapshot impl'ine symlink
    - Import/build için deps/ klasöründeki symlinkler kullanılır
    - bp upgrade symlink'leri günceller, kod değişikliği gerekmez

# =============================================================================
# PROJECT STRUCTURE
# =============================================================================

structure:
  directories:
    src/:
      desc: Tüm kaynak kodlar ve iç blueprint'ler
      has_blueprint: true
    blueprint/:
      desc: bp tool'un internal state'i (history, snapshots, state)
      managed_by: bp tool
    .git/:
      desc: Git version control

  files:
    LICENSE:
      desc: GNU General Public License v3.0
      managed_by: project
      rules:
        - NEVER_MODIFY: Lisans dosyası değiştirilmemeli

    README.md:
      desc: Proje açıklaması ve kullanım kılavuzu
      structure:
        - "Notes from the dev" section (en üstte)
        - Proje açıklaması
        - Kurulum ve kullanım
        - Komut referansı
      rules:
        - NEVER_DELETE: "Notes from the dev" section - Bu bölüm geliştiricinin kişisel notlarını içerir ve AI tarafından ASLA silinmemeli veya değiştirilmemeli
        - Bu section'ın içeriği sadece geliştirici tarafından düzenlenir
    .gitignore:
      desc: Git tarafından ignore edilecek dosyalar
    bp:
      desc: Derlenmiş binary (gitignore'da)
    todo.md:
      desc: Geçici notlar (gitignore'da olabilir)
      rules:
        - AI bu dosyayı okuyabilir ama içeriğini silmemeli
        - Yeni item eklenebilir, mevcut itemlar kullanıcı onayı olmadan silinmez

# =============================================================================
# BUILD & RUN
# =============================================================================

build:
  command: "cd src && go build -o ../bp ./cmd/bp"
  output: "./bp"
  requirements:
    - Go 1.22+

usage:
  examples:
    - "bp validate"
    - "bp validate -r"
    - "bp status"
    - "bp plan -r"
    - "bp cancel"
    - "bp implement"
    - "bp impl"
    - "bp apply -m 'Initial snapshot'"
    - "bp upgrade --all"
    - "bp deps --upgrades"

# =============================================================================
# WORKFLOW
# =============================================================================

workflow:
  summary: |
    Önerilen akış:
    1) Önce BLUEPRINT.yaml / BLUEPRINT.spec.yaml güncellenir
    2) bp plan -r ile leaf-first sıra çıkarılır
    3) Her paket için: bp impl → implementasyon → bp apply
    4) bp apply sonrası impl dosyaları working tree'den temizlenir
    5) Kod görmek için tekrar bp impl gerekir
  notes:
    - BLUEPRINT dosyaları apply sonrası working tree'de kalır
    - impl.lock aktifse "implementing" state vardır
    - impl.hidden working tree'nin gizli olduğunu belirtir
    - Importlar deps/ klasöründeki symlinkler üzerinden yapılır
    - bp upgrade symlink'leri günceller, kod değişikliği gerekmez
  symlink_structure: |
    Snapshot sonrası deps/ klasörü oluşturulur:
    impl/
    ├── main.go
    └── deps/
        ├── yamlparser/ → ../../../yamlparser/blueprint/history/{pinned_id}/impl/
        └── commands/ → ../../../commands/blueprint/history/{pinned_id}/impl/

# =============================================================================
# AI GUIDELINES
# =============================================================================

ai_rules:
  protected_content:
    - section: "Notes from the dev"
      file: README.md
      rule: NEVER_DELETE
      reason: Geliştiricinin kişisel notları, AI tarafından değiştirilemez

    - section: Mevcut todo itemları
      file: todo.md
      rule: PRESERVE
      reason: Kullanıcı onayı olmadan silinmez, sadece yeni ekleme yapılabilir

  general:
    - Blueprint dosyaları spec ile tutarlı tutulmalı
    - Kod değişikliği yaparken ilgili blueprint'i de güncelle
    - Yeni özellik eklerken önce blueprint'e yaz, sonra implement et

# =============================================================================
# DEPENDENCIES
# =============================================================================

dependencies:
  internal:
    - path: ./src
      desc: Ana kaynak kod ve library
