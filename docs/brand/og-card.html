<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:Inter;src:url(../../site/next/assets/inter-latin-wght-normal-Dx4kXJAl.woff2) format("woff2");font-weight:100 900}
@font-face{font-family:Mono;src:url(../../site/next/assets/jetbrains-mono-latin-wght-normal-B9CIFXIH.woff2) format("woff2");font-weight:100 900}
*{margin:0;box-sizing:border-box}
html,body{width:1200px;height:630px;background:#07090D;overflow:hidden}
body{position:relative;font-family:Inter,sans-serif;color:#F4F6FA}
.grid{position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.035) 1px,transparent 1px);background-size:56px 56px;mask-image:radial-gradient(ellipse 70% 70% at 50% 40%,#000 40%,transparent 100%)}
.glow{position:absolute;left:50%;top:58%;width:900px;height:420px;transform:translate(-50%,-50%);background:radial-gradient(ellipse at center,rgba(43,92,217,.42),rgba(43,92,217,.12) 45%,transparent 70%);filter:blur(10px)}
.wrap{position:absolute;inset:0;padding:64px 80px;display:flex;flex-direction:column}
.top{display:flex;align-items:center;justify-content:space-between}
.mark{font-weight:700;font-size:34px;letter-spacing:-.02em}
.chip{font-size:17px;color:#A7B0C0;border:1px solid rgba(255,255,255,.12);border-radius:999px;padding:7px 16px;background:rgba(255,255,255,.03)}
h1{margin-top:auto;font-size:84px;line-height:1.02;letter-spacing:-.045em;font-weight:700}
h1 .b{color:#5B8CFF;display:block}
.row{margin-top:34px;display:flex;align-items:center;gap:14px;font-family:Mono,monospace;font-size:21px;color:#C9D1DE}
.pill{border-radius:999px;padding:6px 14px;font-size:17px}
.amber{color:#F5B54A;border:1px solid rgba(245,181,74,.35);background:rgba(245,181,74,.08)}
.green{color:#4ADE80;border:1px solid rgba(74,222,128,.35);background:rgba(74,222,128,.08)}
.arrow{color:#5B8CFF}
.url{margin-left:auto;font-family:Inter,sans-serif;color:#7F8A9E;font-size:20px}
</style></head><body><div class="grid"></div><div class="glow"></div>
<div class="wrap"><div class="top"><div class="mark">bp</div><div class="chip">Open source · macOS &amp; Linux</div></div>
<h1>Claude Code, Codex &amp; co. as one team.<span class="b">Never interrupted.</span></h1>
<div class="row"><span>alice</span><span class="arrow">→</span><span>bob</span><span class="pill amber">held · bob is busy</span><span class="arrow">→</span><span class="pill green">DELIVERED</span><span class="url">bp.tunapro.xyz</span></div>
</div></body></html>
