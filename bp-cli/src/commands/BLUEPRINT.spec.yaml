# bp/commands - Implementation & Test Specification

_meta:
  version: "0.2.0"
  type: spec

# =============================================================================
# WORKFLOW POLICY
# =============================================================================

workflow_policy:
  summary: |
    Symlink tabanlı dependency yönetimi:
    - Paket klasörü edit alanıdır (working tree)
    - {dep_name}/ → dependency'nin pinned snapshot'ına symlink
    - Import/build için direkt symlink'ler kullanılır (deps/ yok)
    Not: {state_dir} = _meta.state_dir (default .blueprint)

# =============================================================================
# IMPLEMENTATION
# =============================================================================

implementation:
  structure:
    - registry module     # COMMANDS map, komut import/export
    - validate module
    - status module       # + dependents gösterimi
    - plan module         # Leaf-first plan listesi
    - cancel module       # Implementation iptal
    - apply module        # Snapshot al + symlink oluştur
    - deps module         # + --upgrades flag
    - map module          # Project map - snapshot/dependency durumu
    - init module
    - log module          # Snapshot ID formatı
    - diff module
    - show module
    - implement module    # Dependency kontrol + reverse tracking + symlink
    - upgrade module      # Dependency upgrade + test + rollback + rotten

  decisions:
    - q: Neden her komut ayrı modül?
      a: Kolay test, kolay extend. Yeni komut = yeni modül.

    - q: Registry nasıl çalışıyor?
      a: Ana modülde COMMANDS map'i, her komut modülünden import.

  command_details:
    validate:
      checks:
        - YAML syntax (parse edilebilir mi?)
        - _meta.version var mı? (zorunlu → error)
        - intent var mı? (önerilen → warning)
        - api section 300 satırı geçiyor mu? (önerilen → warning)
        - implementation section 900 satırı geçiyor mu? (önerilen → warning)
      line_limits:
        api: 300        # Soft limit, aşılırsa warning
        implementation: 900  # Soft limit, aşılırsa warning
      output_symbols:
        success: "✓"
        warning: "⚠"
        error: "✗"
      exit_codes:
        0: Valid (hata ve warning yok)
        1: Error var (YAML syntax veya _meta.version eksik)
        2: Sadece warning var (intent eksik, satır limiti aşımı gibi)
      recursive_behavior: |
        Default recursive çalışır.
        --no-recursive ile sadece verilen paket kontrol edilir.
        Her blueprint için ayrı satır.
        Exit code önceliği: error (1) > warning (2) > success (0)
        Yani: en az bir error varsa 1, error yok ama warning varsa 2, hiçbiri yoksa 0

    status:
      states:
        fresh: Dosyalar ve dependency'ler snapshot'taki ile aynı
        stale: En az bir dosya veya dependency değişmiş
        no_snapshot: {state_dir}/state.yaml yok
      flags:
        implementing: impl.lock varsa true
        read_only: ro mode'da impl.lock yoksa true
        working_clean: tracked dosyalarda değişiklik yok
        blueprint_changed: BLUEPRINT.yaml hash değişmiş
        api_changed: API section hash değişmiş
        spec_changed: Implementation section hash değişmiş
      staleness_reasons:
        files_changed: Kendi dosyaları değişmiş
        blueprint_changed: BLUEPRINT.yaml değişmiş
        deps_changed: Dependency'nin snapshot'ı değişmiş
        deps_api_changed: Dependency'nin API'si değişmiş (kritik)
      state_yaml_schema: |
        # {state_dir}/state.yaml formatı:
        snapshot_id: "20260116-1430-a1b2-add-feat"  # Mevcut snapshot ID
        blueprint_hash: "sha256:abc123..."          # BLUEPRINT.yaml hash
        impl_hash: "sha256:xyz789..."               # Implementation hash
        files:
          main.go: "sha256:def456..."
          util.go: "sha256:ghi789..."
        deps:                                        # Pin'lenmiş dependency'ler
          "./yamlparser":
            pinned: "20260115-1200-c3d4-stable"
            latest: "20260116-0900-e5f6-new"
            api_hash: "sha256:aaa111..."
            latest_api_hash: "sha256:bbb222..."
            api_changed: true
        dependents:                                  # Kim bize bağlı (reverse)
          "../consumer":
            using: "20260116-1430-a1b2-add-feat"

        Hash'lenen dosyalar:
        - implementation.structure'da listelenen dosyalar
        - Klasörler (has_blueprint: false): içindeki tüm dosyalar recursive
        - Klasörler (has_blueprint: true): dahil edilmez (kendi state'leri var)
        - BLUEPRINT.yaml: ayrıca blueprint_hash olarak saklanır
      changed_files_generation: |
        StatusInfo.changed_files nasıl üretilir:
        1. state.yaml'daki her dosya için mevcut hash hesapla
        2. Hash farklıysa → changed_files listesine ekle
        3. Dosya silinmişse → changed_files'a ekle (prefix: "deleted: ")
        4. Yeni dosya varsa → changed_files'a ekle (prefix: "new: ")
        5. BLUEPRINT.yaml değiştiyse → changed_files'a "BLUEPRINT.yaml" ekle
        6. Mode hide ve impl.lock yoksa, "deleted:" kayıtları ignore edilir
      staleness_algorithm: |
        Hash-based karşılaştırma (pinned/latest modeli):
        1. {state_dir}/state.yaml oku (yoksa → no_snapshot)
        2. Dosya kontrolü:
           - state.yaml'daki her dosya için mevcut hash hesapla
           - Farklıysa → stale (files_changed)
        3. Blueprint kontrolü:
           - BLUEPRINT.yaml hash hesapla
           - Farklıysa → stale (blueprint_changed)
        4. Dependency kontrolü:
           - state.yaml deps bölümündeki her dep için:
           - deps[dep].pinned != deps[dep].latest → stale (deps_changed)
           - deps[dep].api_changed == true → stale (deps_api_changed)
        5. Hiçbiri değişmediyse → fresh

        Stale reason'lar (standardize):
        - files_changed, blueprint_changed, deps_changed, deps_api_changed
        Öncelik: files_changed > blueprint_changed > deps_api_changed > deps_changed
      output_symbols:
        fresh: "✓"
        stale: "⚠"
        no_snapshot: "○"
        implementing: "⧗"
      exit_codes:
        0: fresh
        1: stale
        2: no_snapshot
      recursive_behavior: |
        Default recursive çalışır.
        --no-recursive ile sadece verilen paket kontrol edilir.
        Özet satırı en sonda gösterilir.
        Exit code: en kötü durum (2 > 1 > 0)

    plan:
      purpose: Değişen paketleri leaf-first sırada listele
      steps:
        1: Default recursive olarak BlueprintTree.Walk + TopologicalSort ile sıralama
        --no-recursive verilirse sadece verilen paket listelenir
        2: Her blueprint için staleness kontrolü
        3: state "stale" veya "no_snapshot" ise listeye ekle
        4: Leaf-first sıralı liste yazdır
      notes:
        - deps_changed/deps_api_changed görülen paketlerde import yolları güncellenir
        - Sadece import güncellemesi yapıldıysa yeni snapshot alınmaz
      output:
        format: "{index}. {path} ({state}{reason})"
        empty: "All blueprints fresh"
      exit_codes:
        0: Başarılı (liste boş olabilir)
        1: Hata (circular dependency veya okuma hatası)

    cancel:
      purpose: Aktif implementation oturumunu iptal et
      steps:
        1: impl.lock var mı kontrol et
        2: Yoksa: "No active implementation.", exit 1
        3: Varsa: impl.lock sil
        4: Mode'a göre cleanup yap (pussy: none, ro: chmod -w, hide: delete)
        5: "Implementation cancelled.", exit 0
      exit_codes:
        0: Başarılı
        1: Aktif implementasyon yok veya hata

    apply:
      purpose: Snapshot al, dependency symlink'leri oluştur, working tree temizle
      steps:
        0: Mode kontrolü (ro/hide → impl.lock zorunlu, pussy → kontrol yok)
        1: Blueprint'i validate et (error varsa exit 2)
        2: tests.verification çalıştır (--skip-tests ile atlanır)
        3: Snapshot oluştur (history/{id}/)
        4: history/{id}/ altına kod kopyala (direkt)
        5: history/{id}/ içinde dependency symlink'lerini oluştur (direkt)
        6: Mode'a göre working tree işlemi (impl.lock sil dahil)
        7: state.yaml güncelle
        8: current dosyasını güncelle
      exit_codes:
        0: Başarılı
        1: Testler başarısız veya hata
        2: Validation hatası

    deps:
      algorithm: Kahn's algorithm (topological sort)
      dependency_sources: |
        Edge'ler iki kaynaktan gelir:
        1. Implicit: Alt klasörlerde BLUEPRINT.yaml varsa → dependency
           (implementation.structure'da has_blueprint: false olanlar hariç)
        2. Explicit: BLUEPRINT.yaml'daki dependencies bölümü
           Format A - Basit liste: dependencies: [../other, ../utils]
           Format B - Detaylı map:
             dependencies:
               internal: [{path: ./x}, {path: ./y}]
               from_parent: [Blueprint]  # Tip referansı, path değil
           Parse: Array → path listesi, Map → internal[].path listesi
      output_format: |
        Numaralı liste, leaf'ler önce:
        1. ./commands
        2. . (current)
      circular_detection: Graph traversal sırasında cycle tespit edilir
      exit_codes:
        0: Başarılı
        1: Circular dependency veya hata
      error_conditions:
        - "Circular dependency detected: a → b → a": Döngüsel bağımlılık

    init:
      template_source: Ana blueprint'teki blueprint_template kullanılır
      folder_name: Klasör adı template'e {folder_name} olarak eklenir
      date: Bugünün tarihi {date} olarak eklenir
      exit_codes:
        0: Blueprint oluşturuldu
        1: Zaten var veya hata
      error_conditions:
        - "BLUEPRINT.yaml already exists": Dosya zaten mevcut

    log:
      default_count: 10
      empty_output: "No snapshot history"
      sort_order: Yeniden eskiye (son snapshot en üstte)
      format: "{snapshot_id}   \"{message}\""
      meta_yaml_schema: |
        # {state_dir}/history/{id}/meta.yaml formatı:
        id: "20260116-1430-a1b2-add-feat"   # Snapshot ID (timestamp-hash-slug)
        timestamp: "2026-01-16T14:30:00"    # ISO 8601, local timezone
        message: "Add feature"               # -m ile verilen veya tarih
        content_hash: "sha256:full..."       # Tam content hash
        api_hash: "sha256:abc..."            # API section hash
        spec_hash: "sha256:def..."           # Implementation section hash
        impl_hash: "sha256:xyz..."           # Implementation hash

        Timestamp kuralları:
        - Format: ISO 8601 (YYYY-MM-DDTHH:MM:SS)
        - Timezone: Local time (UTC offset yok, basitlik için)
      exit_codes:
        0: Başarılı (boş geçmiş dahil)
        1: Hata

    diff:
      algorithm: unified diff (standart unified diff algoritması)
      id_resolution: |
        - "current" veya argüman yok → mevcut BLUEPRINT.yaml
        - "20260116-1430-a1b2-add-feat" → {state_dir}/history/{id}/BLUEPRINT.yaml
        - Kısmi ID desteklenir (en az tarih kısmı, benzersiz olmalı)
      output: |
        Fark varsa: Standart unified diff formatı (--- +++ @@ ile)
        Fark yoksa: Boş çıktı (stdout'a hiçbir şey yazılmaz)
      no_changes_behavior: |
        unified_diff boş döndüğünde:
        - output: "" (boş string)
        - DiffResult.has_changes: false
        - DiffResult.unified_diff: ""
        - exit_code: 0
      exit_codes:
        0: Başarılı (fark var veya yok)
        1: Hata (ID bulunamadı, history yok)
      error_conditions:
        - "Snapshot #XXXX not found": Verilen ID history'de yok
        - "No snapshot history": {state_dir}/history/ yok veya boş

    show:
      behavior: Snapshot'ın BLUEPRINT.yaml içeriğini stdout'a yazar
      id_resolution: |
        - Argüman yok → son snapshot ({state_dir}/current'tan oku)
        - "20260116-1430-a1b2-add-feat" → ilgili snapshot
        - Kısmi ID desteklenir (en az tarih kısmı, benzersiz olmalı)
      current_file_handling: |
        {state_dir}/current dosyası:
        - Yoksa → "No snapshot history" hatası (exit 1)
        - Boşsa → "No snapshot history" hatası (exit 1)
        - Geçersiz ID içeriyorsa (örn: "abc") → '"Invalid current snapshot ID" hatası (exit 1)'
        - Geçerli ID ama klasör yoksa → "Snapshot #XXXX not found" hatası (exit 1)
      exit_codes:
        0: Başarılı
        1: Hata (ID bulunamadı, history yok, current bozuk)
      error_conditions:
        - "Snapshot #XXXX not found": Verilen ID history'de yok
        - "No snapshot history": {state_dir}/history/ yok veya boş
        - "Invalid current snapshot ID": {state_dir}/current geçersiz format

    implement:
      purpose: Implementation başlat - dependency kontrol + reverse tracking + symlink
      steps:
        0: Blueprint'i validate et (error varsa exit 2)
        1: Aktif implementasyon varsa hata ver (impl.lock varsa)
        2: Blueprint'i yükle, dependencies bölümünü oku
        3: Dependency yoksa → "No dependencies, ready to implement"
        4: Her dependency için reverse tracking + pin ekle
        5: Paket kökünde dependency symlink'lerini oluştur/güncelle
        6: |
          - pussy: impl.lock oluştur
          - ro: impl.lock oluştur, dosyaları writable yap (chmod +w)
          - hide: --clean değilse snapshot'tan restore et (snapshot_id varsa onu), impl.lock oluştur
        7: "Ready to implement" mesajı ver
      exit_codes:
        0: Ready to implement
        1: Dependency snapshot eksik
        2: Blueprint bulunamadı

    upgrade:
      purpose: Dependency'leri güncelle (symlink günceller)
      steps:
        1: state.yaml deps bölümünü oku
        2: Her dependency için latest_id ve api_hash al
        3: state.yaml deps güncelle
        4: Working tree aktifse paket içindeki symlink'i güncelle
        5: API değişikliği varsa uyarı göster
      flags:
        safe: Sadece API değişmeyenleri upgrade et
        all: Tüm dependency'leri upgrade et
      exit_codes:
        0: Upgrade başarılı
        1: Hata

# =============================================================================
# TESTS
# =============================================================================

tests:
  packages:
    - "."
  snapshot_readonly: true
  scenarios:
    # =========================================================================
    # REGISTRY / GENEL
    # =========================================================================
    - id: registry_all_commands
      given: COMMANDS dict
      then: 14 komut var (validate, status, plan, cancel, apply, deps, map, init, log, diff, show, implement, impl, upgrade)

    - id: unknown_command
      given: COMMANDS'ta olmayan komut
      when: bp xyz
      then: '"Unknown command: xyz" hatası, exit 1'

    - id: command_error_handling
      given: Komut exception fırlatır
      when: Çalıştırılır
      then: Graceful error message, stack trace değil

    - id: command_returns_result
      given: Herhangi bir komut
      when: Çağrılır
      then: CommandResult döner (exit_code, output, data, errors)

    # =========================================================================
    # VALIDATE
    # =========================================================================
    - id: validate_valid
      given: Geçerli BLUEPRINT.yaml
      when: bp validate
      then: '"✓ ./BLUEPRINT.yaml", exit 0'

    - id: validate_invalid_yaml
      given: Bozuk YAML syntax (indent hatası)
      when: bp validate
      then: '"✗ ./BLUEPRINT.yaml: line 5: ..." hatası, exit 1'

    - id: validate_missing_version
      given: _meta.version yok
      when: bp validate
      then: '"✗ ./BLUEPRINT.yaml: missing _meta.version", exit 1'

    - id: validate_missing_intent
      given: intent alanı yok (ama _meta.version var)
      when: bp validate
      then: '"⚠ ./BLUEPRINT.yaml: missing intent", exit 2'

    - id: validate_recursive
      given: 2 alt klasör (1 valid, 1 invalid)
      when: bp validate
      then: |
        Her blueprint listelenir:
        ✓ ./BLUEPRINT.yaml
        ✓ ./commands/BLUEPRINT.yaml
        ✗ ./other/BLUEPRINT.yaml: missing _meta.version
        exit 1 (en az bir hata var)

    - id: validate_no_blueprint
      given: BLUEPRINT.yaml yok
      when: bp validate
      then: '"✗ ./BLUEPRINT.yaml: file not found", exit 1'

    - id: validate_api_line_limit
      given: api section 350 satır (limit 300)
      when: bp validate
      then: '"⚠ ./BLUEPRINT.yaml: api exceeds 300 lines (350 lines)", exit 2'

    - id: validate_impl_line_limit
      given: implementation section 1000 satır (limit 900)
      when: bp validate
      then: '"⚠ ./BLUEPRINT.yaml: implementation exceeds 900 lines (1000 lines)", exit 2'

    - id: validate_line_limit_under
      given: api 200 satır, implementation 500 satır (limitler altında)
      when: bp validate
      then: '"✓ ./BLUEPRINT.yaml", exit 0 (uyarı yok)'

    # =========================================================================
    # STATUS
    # =========================================================================
    - id: status_fresh
      given: Snapshot var, dosyalar değişmemiş
      when: bp status
      then: '"✓ . (fresh)", exit 0'

    - id: status_stale
      given: Snapshot var, 2 dosya değişmiş
      when: bp status
      then: '"⚠ . (stale, 2 files changed)", exit 1'

    - id: status_no_snapshot
      given: {state_dir}/ yok
      when: bp status
      then: '"○ . (no snapshot)", exit 2'

    - id: status_recursive
      given: 2 alt paket (1 fresh, 1 stale)
      when: bp status
      then: |
        ✓ ./commands (fresh)
        ⚠ ./other (stale, 1 file changed)
        ---
        1 fresh, 1 stale
        exit 1

    - id: status_blueprint_changed
      given: Snapshot var, BLUEPRINT.yaml değişmiş
      when: bp status
      then: '"⚠ . (stale, BLUEPRINT.yaml changed)", exit 1'

    # =========================================================================
    # PLAN
    # =========================================================================
    - id: plan_lists_stale_leaf_first
      given: Root paketin 2 dependency'si var (leaf + mid), root stale
      when: bp plan
      then: |
        1. ./leaf (no snapshot)
        2. ./mid (stale, deps_changed)
        3. . (stale, deps_changed)
        exit 0

    # =========================================================================
    # CANCEL
    # =========================================================================
    - id: cancel_no_active
      given: impl.lock yok
      when: bp cancel
      then: '"No active implementation.", exit 1'

    - id: cancel_success
      given: impl.lock var
      when: bp cancel
      then: '"Implementation cancelled.", exit 0'

    # =========================================================================
    # DEPS
    # =========================================================================
    - id: deps_no_deps
      given: Alt klasörde blueprint yok
      when: bp deps
      then: |
        1. . (current)
        exit 0

    - id: deps_with_subdirs
      given: commands/ alt paketi var
      when: bp deps
      then: |
        1. ./commands
        2. . (current)
        exit 0 (topological order)

    - id: deps_circular
      given: a → b, b → a (explicit dependency ile)
      when: bp deps
      then: '"Circular dependency detected: a → b → a", exit 1'

    - id: deps_deep_nesting
      given: a/b/c/d hiyerarşisi
      when: bp deps a/
      then: d, c, b, a sırasında listelenir

    # =========================================================================
    # INIT
    # =========================================================================
    - id: init_empty_dir
      given: Boş klasör
      when: bp init
      then: BLUEPRINT.yaml oluşur (template), exit 0

    - id: init_existing
      given: BLUEPRINT.yaml zaten var
      when: bp init
      then: '"BLUEPRINT.yaml already exists", exit 1'

    - id: init_with_path
      given: newpkg/ klasörü var, blueprint yok
      when: bp init newpkg/
      then: newpkg/BLUEPRINT.yaml oluşur

    - id: init_template_valid
      given: bp init çalıştı
      then: Oluşan BLUEPRINT.yaml, bp validate'den geçer

    # =========================================================================
    # LOG
    # =========================================================================
    - id: log_empty
      given: {state_dir}/history/ yok veya boş
      when: bp log
      then: '"No snapshot history", exit 0'

    - id: log_default
      given: 15 snapshot var
      when: bp log
      then: Son 10 snapshot gösterilir (default count)

    - id: log_with_count
      given: 5 snapshot var
      when: bp log -n 2
      then: Son 2 snapshot gösterilir

    - id: log_format
      given: Snapshot'lar var
      when: bp log
      then: |
        Format:
        20260115-1030-a1b2-message-here    "Message here"
        20260114-1500-9f8e-another-msg     "Another message"

    # =========================================================================
    # DIFF
    # =========================================================================
    - id: diff_no_args
      given: Snapshot var
      when: bp diff
      then: Current blueprint vs son snapshot, unified diff format

    - id: diff_single_id
      given: 20260115-1000-a1b2-initial snapshot var
      when: bp diff 20260115-1000-a1b2-initial
      then: O snapshot vs current blueprint

    - id: diff_two_ids
      given: İki snapshot var
      when: bp diff 20260114-0900-x1y2-first 20260115-1000-a1b2-second
      then: İlk snapshot vs ikinci snapshot

    - id: diff_no_changes
      given: Blueprint değişmemiş
      when: bp diff
      then: Boş çıktı (stdout'a hiçbir şey yazılmaz), exit 0

    - id: diff_not_found
      given: Snapshot yok
      when: bp diff 20260199-9999-xxxx-nonexistent
      then: '"Snapshot not found", exit 1'

    - id: diff_no_history
      given: Hiç snapshot yok
      when: bp diff
      then: '"No snapshot history", exit 1'

    # =========================================================================
    # SHOW
    # =========================================================================
    - id: show_default
      given: Snapshot var
      when: bp show
      then: Son snapshot'ın BLUEPRINT.yaml içeriği

    - id: show_specific
      given: 20260115-1000-a1b2-initial snapshot var
      when: bp show 20260115-1000-a1b2-initial
      then: O snapshot'ın BLUEPRINT.yaml içeriği

    - id: show_not_found
      given: Snapshot yok
      when: bp show 20260199-9999-xxxx-nonexistent
      then: '"Snapshot not found", exit 1'

    - id: show_no_history
      given: Hiç snapshot yok
      when: bp show
      then: '"No snapshot history", exit 1'

    - id: show_current_corrupt
      given: {state_dir}/current içeriği "abc" (geçersiz format)
      when: bp show
      then: '"Invalid current snapshot ID", exit 1'

    - id: show_current_missing_snapshot
      given: {state_dir}/current = "20260115-1000-a1b2-initial" ama o klasör yok
      when: bp show
      then: '"Snapshot not found", exit 1'

    # =========================================================================
    # APPLY (Snapshot)
    # =========================================================================
    - id: apply_success
      given: Valid blueprint, testler geçiyor, impl.lock var
      when: bp apply -m "v1.0 release"
      then: |
        - {state_dir}/history/20260116-HHMM-xxxx-v10-release/ oluşur
        - history/{id}/ altında kod + symlink'ler direkt oluşur
        - {state_dir}/current güncellenir
        - exit 0

    - id: apply_validation_error
      given: Invalid blueprint (_meta.version yok)
      when: bp apply
      then: '"Validation failed: missing _meta.version", exit 2'

    - id: apply_tests_fail
      given: Valid blueprint, tests.verification başarısız
      when: bp apply
      then: '"Tests failed", exit 1, snapshot alınmaz'

    - id: apply_skip_tests
      given: Valid blueprint, tests.verification başarısız
      when: bp apply --skip-tests
      then: Snapshot alınır (testler atlandı), exit 0

    - id: apply_creates_symlinks
      given: 2 dependency var, impl.lock var
      when: bp apply -m "with deps"
      then: |
        history/{id}/ altında symlink'ler oluşur:
        - yamlparser/ → symlink
        - commands/ → symlink

    - id: apply_no_impl_lock
      given: ro mode, impl.lock yok
      when: bp apply
      then: '"No active implementation", exit 1'

    # =========================================================================
    # DEPENDENCY TRACKING (STATUS)
    # =========================================================================

    - id: status_deps_fresh
      given: Dependency'ler güncel (pinned == latest, api_changed == false)
      when: bp status
      then: fresh

    - id: status_deps_snapshot_changed
      given: Dependency'nin latest'i değişmiş (pinned != latest)
      when: bp status
      then: stale, "deps changed: ./commands" mesajı

    - id: status_deps_api_changed
      given: Dependency'nin api_changed == true
      when: bp status
      then: stale, "deps changed: ./commands" mesajı (kritik uyarı)

    # =========================================================================
    # IMPLEMENT
    # =========================================================================
    - id: implement_no_deps
      given: Blueprint'te dependency yok
      when: bp implement
      then: |
        "No dependencies, ready to implement"
        exit 0

    - id: implement_deps_ready
      given: 2 dependency var, ikisinin de snapshot'ı mevcut
      when: bp implement
      then: |
        Dependencies:
          ./yamlparser @ 20260115-1000-a1b2-stable ✓
          ./commands   @ 20260116-0900-c3d4-init   ✓
        Ready to implement.
        exit 0

    - id: implement_dep_missing_snapshot
      given: Dependency'nin snapshot'ı yok ({state_dir}/state.yaml yok)
      when: bp implement
      then: |
        ✗ Dependency ./yamlparser has no snapshot. Run 'bp apply' in ./yamlparser first.
        exit 1

    - id: implement_reverse_tracking
      given: A paketi B'ye bağlı, B'nin snapshot'ı var
      when: cd A && bp implement
      then: |
        B'nin {state_dir}/state.yaml'ına eklenir:
        dependents:
          "../A":
            using: "20260116-1000-xxxx-stable"

    - id: implement_pins_deps
      given: bp implement başarılı
      then: |
        Kendi state.yaml'a deps eklenir:
        deps:
          "./yamlparser":
            pinned: "20260115-1000-a1b2-stable"
            latest: "20260115-1000-a1b2-stable"
            api_hash: "sha256:..."
            latest_api_hash: "sha256:..."
            api_changed: false

    - id: implement_no_blueprint
      given: BLUEPRINT.yaml yok
      when: bp implement
      then: exit 2, "Blueprint not found"

    # =========================================================================
    # UPGRADE
    # =========================================================================
    - id: upgrade_single_dep
      given: ./yamlparser'ın yeni snapshot'ı var
      when: bp upgrade ./yamlparser
      then: |
        Upgraded ./yamlparser: 20260115-1000-a1b2-stable → 20260116-0900-c3d4-new
        exit 0

    - id: upgrade_api_changed
      given: Dependency'nin API'si değişmiş
      when: bp upgrade ./yamlparser
      then: |
        Upgraded ./yamlparser: 20260115-1000-a1b2-stable → 20260116-0900-c3d4-new (API CHANGED!)
          Review: bp diff ./yamlparser 20260115-1000-a1b2-stable 20260116-0900-c3d4-new
        exit 0 (uyarı verilir ama bloklanmaz)

    - id: upgrade_safe_flag
      given: 2 dep var (1 API değişmiş, 1 değişmemiş)
      when: bp upgrade --safe
      then: |
        Upgraded ./commands: 20260115-xxxx → 20260116-yyyy
        Skipped ./yamlparser (API changed)
        exit 0

    - id: upgrade_all_flag
      given: 2 dep var, ikisi de upgrade edilebilir
      when: bp upgrade --all
      then: |
        Upgraded ./yamlparser: 20260115-xxxx → 20260116-yyyy (API CHANGED!)
        Upgraded ./commands: 20260115-xxxx → 20260116-yyyy
        exit 0

    - id: upgrade_no_upgrades
      given: Tüm dependency'ler güncel
      when: bp upgrade --all
      then: '"No upgrades available", exit 0'

    - id: upgrade_updates_reverse
      given: bp upgrade ./dep başarılı
      then: |
        Dependency'nin state.yaml dependents'ı güncellenir:
        dependents:
          "../me":
            using: "20260116-0900-c3d4-new"  # yeni snapshot ID

    - id: upgrade_dep_not_found
      given: Dependency path yanlış
      when: bp upgrade ./nonexistent
      then: exit 1, "Dependency not found: ./nonexistent"

    - id: upgrade_test_fail_rollback
      given: Dependency upgrade sonrası testler fail
      when: bp upgrade ./yamlparser
      then: |
        Failed ./yamlparser: tests failed, rolled back, marked rotten
        - Symlink eski haline döner
        - Dependency meta.yaml'a rotten: true yazılır
        exit 1

    - id: upgrade_skip_rotten
      given: Dependency'nin latest snapshot'ı rotten
      when: bp upgrade ./yamlparser
      then: |
        Skipped ./yamlparser: rotten (use --force)
        exit 0

    - id: upgrade_force_rotten
      given: Dependency'nin latest snapshot'ı rotten
      when: bp upgrade ./yamlparser --force
      then: |
        Upgraded ./yamlparser (forced): 20260115-xxxx → 20260116-yyyy [ROTTEN]
        ⚠ Warning: using rotten snapshot
        exit 0

    # =========================================================================
    # MAP
    # =========================================================================
    - id: map_basic
      given: 2 paket var (root + yamlparser)
      when: bp map
      then: |
        ./
          snapshot: 20260116-1430-a1b2-feature
          api: sha256:abc123...
          deps:
            ./yamlparser @ 20260115-1000-x1y2 (api: def456)

        ./yamlparser/
          snapshot: 20260115-1000-x1y2-stable
          api: sha256:def456...
          deps: (none)

    - id: map_shows_rotten
      given: Dependency rotten flag var
      when: bp map
      then: "[ROTTEN] işareti görünür"

    # =========================================================================
    # ROTTEN WARNING
    # =========================================================================
    - id: rotten_warning_on_any_command
      given: state.yaml'da rotten dependency var
      when: bp status (veya herhangi bir komut)
      then: |
        ⚠ Rotten dependency: ./yamlparser (tests failed on upgrade)
        ✓ . (fresh)
        (uyarı stderr'e, komut çıktısı stdout'a)

    # =========================================================================
    # DEPENDENCY UPGRADE WARNINGS (Status/Validate)
    # =========================================================================
    - id: dep_warning_on_validate
      given: Dependency upgrade mevcut
      when: bp validate
      then: |
        ⚠ ./yamlparser: 20260115-xxxx → 20260116-yyyy
        ✓ ./BLUEPRINT.yaml
        (uyarı stderr'e, validation stdout'a)

    - id: dep_warning_on_apply
      given: Dependency upgrade mevcut, API değişmiş
      when: bp apply -m "feature"
      then: |
        ⚠ ./yamlparser: 20260115-xxxx → 20260116-yyyy (API CHANGED!)
        Snapshot created: 20260116-1430-xxxx-feature
        (uyarı verilir ama snapshot alınır)

    - id: deps_upgrades_flag
      given: 2 dep var (1 upgrade edilebilir, 1 güncel)
      when: bp deps --upgrades
      then: |
        ./yamlparser: 20260115-1000-a1b2-stable → 20260116-0900-c3d4-new (API CHANGED!)
        ./commands: (up to date)

    # =========================================================================
    # REVERSE DEPENDENCY (Status)
    # =========================================================================
    - id: status_shows_dependents
      given: 2 paket bize bağlı (A güncel, B eski versiyon)
      when: bp status
      then: |
        ✓ . (fresh)
        Dependents:
          ../A using 20260116-1430-xxxx (current)
          ../B using 20260115-1000-yyyy (OUTDATED - 2 behind)

    - id: status_dependents_outdated_count
      given: B, 3 versiyon gerideki snapshot'ı kullanıyor
      when: bp status
      then: '"../B using ... (OUTDATED - 3 behind)"'

  verification:
    - go test $(go list ./... | grep -v '/blueprint/')
    - ../../bp validate . || [ $? -eq 2 ]
